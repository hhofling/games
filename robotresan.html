<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff1ff">
<title>Robotresan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: banan till vänster, programmet och knapparna till höger. En kolumn på telefon. */
:root{
  --bg:#dff1ff; --ink:#12324a; --muted:#46647c; --card:#ffffff; --edge:#2b5d82;
  --grass:#92d67d; --grass2:#86cc72; --water:#58b0ff; --line:#b3d4ec;
  --go:#22a152; --accent:#ff7a3d; --gold:#ffc21a; --shadow:rgba(18,50,74,.22);
  --volt:#fff0a8; --laser:#ff2d55;
  --font:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.35;
  padding-block:16px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:4px solid var(--accent); outline-offset:2px}
.wrap{max-width:980px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:18px 24px}
header{grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px}
h1{font-size:2rem; font-weight:700; margin:0; letter-spacing:.01em}
h1 small{display:block; font-size:1rem; font-weight:500; color:var(--muted); letter-spacing:0}
.tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.score{min-height:44px; padding:6px 14px; border-radius:12px; border:3px solid var(--edge); background:var(--gold); font-weight:700; box-shadow:0 3px 0 var(--shadow); display:flex; align-items:center}
.small-btn{min-height:44px; padding:6px 14px; border-radius:12px; border:3px solid var(--edge); background:var(--card); font-size:1rem; font-weight:600; box-shadow:0 3px 0 var(--shadow)}
.small-btn[aria-pressed="false"]{opacity:.6}
.levels{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:10px 18px}
.tier{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.tier b{font-size:.95rem; font-weight:600; color:var(--muted); width:100%}
.lvl{min-width:56px; min-height:56px; padding:4px 8px; border-radius:14px; border:3px solid var(--edge); background:var(--card); font-weight:700; font-size:1.15rem; line-height:1.1; box-shadow:0 3px 0 var(--shadow)}
.lvl span{display:block; font-size:.78rem; color:var(--gold); letter-spacing:.08em; min-height:1em; -webkit-text-stroke:.5px var(--edge)}
.tier.t1 .lvl{background:#fff6dc} .tier.t2 .lvl{background:#ffe3e3}
.lvl[aria-current="true"]{background:var(--accent)!important; color:#2a1200}
.lvl[aria-current="true"] span{color:#fff}

.stage{min-width:0}
.board-wrap{position:relative}
.board{
  position:relative; display:grid; width:100%; border:5px solid var(--edge); border-radius:20px; overflow:hidden;
  container-type:inline-size; background:var(--grass); box-shadow:0 5px 0 var(--shadow);
  grid-template-columns:repeat(var(--w),1fr); aspect-ratio:var(--w)/var(--h);
}
.cell{display:grid; place-items:center; font-size:calc(100cqw / var(--w) * .6); line-height:1; user-select:none}
.cell.g0{background:var(--grass)} .cell.g1{background:var(--grass2)}
.cell.water{background:var(--water)}
.cell.bridge{background:var(--water); position:relative}
.cell.bridge::before{content:""; position:absolute; inset:0 14%; border-radius:6px; border:3px solid #6b4220;
  background:repeating-linear-gradient(0deg,#c58c4a 0 22%,#a9733a 22% 26%)}
.cell.goal{background:#b9ec9f}
.cell.charger{background:var(--volt); box-shadow:inset 0 0 0 4px #f2c200}
.cell.charger.zap{animation:zap .6s}
@keyframes zap{50%{background:#fff; box-shadow:inset 0 0 0 8px #f2c200}}
.cell .boom{animation:boom .5s forwards}
@keyframes boom{0%{transform:scale(.6)} 50%{transform:scale(1.4)} 100%{transform:scale(1.6); opacity:0}}
.apple{transition:transform .25s, opacity .25s}
.apple.gone{transform:scale(.2); opacity:0}
.robot{
  position:absolute; left:0; top:0; width:calc(100% / var(--w)); aspect-ratio:1;
  transform:translate(calc(var(--x) * 100%), calc(var(--y) * 100%)); transition:transform .4s ease-in-out;
  pointer-events:none; z-index:2;
}
.robot.snap{transition:none}
.bot{width:100%; height:100%; display:block; transition:transform .35s ease-in-out}
.robot.snap .bot{transition:none}
.robot.bump .bot{animation:bump .4s}
.robot.hop{transition-duration:.5s}
.robot.hop .bot{animation:hop .5s ease-in-out}
.robot.empty .bot{animation:sag .6s; filter:grayscale(.8)}
@keyframes bump{0%,100%{translate:0 0} 25%{translate:-9% 0} 75%{translate:9% 0}}
@keyframes hop{0%,100%{scale:1} 50%{scale:1.45}}
@keyframes sag{0%,100%{scale:1} 50%{scale:.85}}
.beam{position:absolute; height:12%; max-height:10px; min-height:5px; border-radius:6px; background:var(--laser);
  box-shadow:0 0 8px 3px rgba(255,45,85,.6); transform-origin:0 50%; z-index:1; pointer-events:none; animation:beam .45s forwards}
@keyframes beam{0%{opacity:0} 20%{opacity:1} 70%{opacity:1} 100%{opacity:0}}

.battery{display:flex; align-items:center; gap:10px; margin:12px 2px 0; flex-wrap:wrap}
.battery[hidden]{display:none}
.battery strong{font-weight:600}
.cells{display:flex; gap:4px; padding:4px; border:3px solid var(--edge); border-radius:10px; background:var(--card); position:relative}
.cells::after{content:""; position:absolute; right:-9px; top:30%; width:6px; height:40%; background:var(--edge); border-radius:0 3px 3px 0}
.cells i{width:16px; height:22px; border-radius:4px; background:#e3edf5; transition:background .25s}
.cells i.on{background:var(--go)}
.cells.low i.on{background:#e2a400}
.cells.empty i{background:#f6c9c0}
.cost{font-size:.9rem; color:var(--muted); width:100%}

.legend{display:flex; flex-wrap:wrap; gap:6px 8px; margin:12px 2px 0; padding:0; list-style:none}
.legend[hidden]{display:none}
.legend li{display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--card); border:2px solid var(--line); font-size:.95rem; font-weight:500}
.legend li b{font-size:1.15rem; font-weight:400}
.pop{position:absolute; transform:translate(-50%,-50%); font-weight:700; font-size:clamp(.9rem,4cqw,1.6rem); pointer-events:none; z-index:4;
  color:#fff; -webkit-text-stroke:1px var(--ink); paint-order:stroke; text-shadow:0 2px 0 var(--ink); animation:pop-up 1s forwards}
.pop.pts{color:var(--gold)} .pop.volt{color:#fff36b}
@keyframes pop-up{0%{opacity:0; translate:0 20%} 15%{opacity:1} 100%{opacity:0; translate:0 -120%}}
.msg{margin:12px 2px 0; min-height:3.2em; font-weight:500; font-size:1.05rem}
.msg.bad{color:#a8330a} .msg.good{color:#0f6b34}

.panel{min-width:0; display:flex; flex-direction:column; gap:14px}
.panel h2{font-size:1.1rem; margin:0 0 6px; font-weight:600; color:var(--muted)}
.goals{font-size:.95rem; color:var(--muted); margin:6px 2px 0}
.prog{
  min-height:68px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start;
  background:var(--card); border:3px dashed var(--line); border-radius:16px;
}
.prog:empty::before{content:"Tryck på knapparna för att bygga ett program"; color:var(--muted); padding:8px 6px; font-size:1rem}
.chip{width:46px; height:46px; display:grid; place-items:center; border-radius:12px; background:#e9f4fd; border:3px solid var(--edge)}
.chip.J{background:#efe6ff} .chip.X{background:#ffe3e8}
.chip svg{width:26px; height:26px}
.chip.on{background:var(--accent); border-color:#2a1200}
.cmds{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.cmd{
  min-height:86px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border-radius:18px; border:3px solid var(--edge); background:var(--card); font-size:1.05rem; font-weight:600;
  box-shadow:0 5px 0 var(--shadow);
}
.cmd[hidden]{display:none}
.cmd[data-c="J"]{background:#efe6ff} .cmd[data-c="X"]{background:#ffe3e8}
.cmd svg{width:38px; height:38px}
.cmd:active{transform:translateY(3px); box-shadow:0 2px 0 var(--shadow)}
.actions{display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px}
.run{min-height:64px; border-radius:18px; border:3px solid #0d5a2e; background:var(--go); color:#fff; font-size:1.5rem; font-weight:700; box-shadow:0 5px 0 #0d5a2e}
.run:active{transform:translateY(3px); box-shadow:0 2px 0 #0d5a2e}
.run.stop{background:#d9442b; border-color:#7d1f0e; box-shadow:0 5px 0 #7d1f0e}
.sec{min-height:64px; border-radius:18px; border:3px solid var(--edge); background:var(--card); font-size:1.05rem; font-weight:600; box-shadow:0 5px 0 var(--shadow)}
button:disabled{opacity:.45; cursor:not-allowed}

.win{position:absolute; inset:0; display:grid; place-items:center; padding:14px; background:rgba(18,50,74,.6); border-radius:20px; z-index:3}
.win[hidden]{display:none}
.win-card{background:var(--card); border:4px solid var(--edge); border-radius:22px; padding:16px 18px; text-align:center; max-width:380px; width:100%; max-height:100%; overflow:auto}
.win-card h2{margin:0; font-size:1.7rem}
.stars{font-size:2.4rem; letter-spacing:.1em; color:var(--gold); -webkit-text-stroke:1.5px var(--edge); margin:2px 0}
.stars i{font-style:normal; display:inline-block; animation:pop .5s both}
.stars i:nth-child(2){animation-delay:.15s} .stars i:nth-child(3){animation-delay:.3s}
.stars i.off{color:#e3edf5; animation:none}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)} 70%{transform:scale(1.3) rotate(8deg)} 100%{transform:scale(1)}}
.pts{list-style:none; margin:4px 0 6px; padding:0; text-align:left; font-size:1rem}
.pts li{display:flex; justify-content:space-between; gap:10px; padding:3px 6px; border-bottom:2px dotted var(--line)}
.pts li.miss{color:#8aa0b2}
.pts li.sum{font-weight:700; border-bottom:none; font-size:1.1rem}
.win-card p{margin:4px 0 10px; font-size:1rem}
.win-btns{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.win-btns .go{background:var(--go); color:#fff; border-color:#0d5a2e}

@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){
  .pop{animation-duration:1.2s}
  .robot,.bot,.apple{transition:none}
  .robot.bump .bot,.robot.hop .bot,.robot.empty .bot,.stars i,.cell .boom,.cell.charger.zap{animation:none}
}
</style>
<style>body{margin:0}</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Robotresan <small id="lvlname"></small></h1>
    <div class="tools">
      <span class="score" id="score" aria-live="polite"></span>
      <button class="small-btn" id="speak" type="button">Läs upp</button>
      <button class="small-btn" id="snd" type="button" aria-pressed="true">Ljud på</button>
      <span id="spelarplats"></span>
    </div>
  </header>
  <nav class="levels" id="levels" aria-label="Välj bana"></nav>

  <section class="stage">
    <div class="board-wrap">
      <div class="board" id="board" role="img" aria-label="Spelplan"></div>
      <div class="win" id="win" hidden>
        <div class="win-card" role="dialog" aria-labelledby="wt">
          <h2 id="wt">Bra jobbat!</h2>
          <div class="stars" id="wstars"></div>
          <ul class="pts" id="wpts"></ul>
          <p id="wtext"></p>
          <div class="win-btns">
            <button class="small-btn go" id="wnext" type="button">Nästa bana</button>
            <button class="small-btn" id="wagain" type="button">Spela igen</button>
          </div>
        </div>
      </div>
    </div>
    <ul class="legend" id="legend" aria-label="Vad sakerna gör"></ul>
    <div class="battery" id="battery" hidden>
      <strong>Batteri</strong>
      <div class="cells" id="cells" role="meter" aria-label="Energi" aria-valuemin="0"></div>
      <span class="cost">Framåt 1 · Hoppa 2 · Skjut 1 · Sväng 0 · ⚡ laddar fullt</span>
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

  <section class="panel">
    <div>
      <h2>Ditt program</h2>
      <div class="prog" id="prog" aria-label="Program"></div>
      <p class="goals" id="goals"></p>
    </div>
    <div class="cmds">
      <button class="cmd" type="button" data-c="F"><span data-i="F"></span>Framåt</button>
      <button class="cmd" type="button" data-c="L"><span data-i="L"></span>Vänster</button>
      <button class="cmd" type="button" data-c="R"><span data-i="R"></span>Höger</button>
      <button class="cmd" type="button" data-c="J"><span data-i="J"></span>Hoppa</button>
      <button class="cmd" type="button" data-c="X"><span data-i="X"></span>Skjut</button>
    </div>
    <div class="actions">
      <button class="run" id="run" type="button">Kör</button>
      <button class="sec" id="undo" type="button">Ångra</button>
      <button class="sec" id="clear" type="button">Rensa</button>
    </div>
  </section>
</div>

<script>
/*PURE-START*/
const DIRN=[[0,-1],[1,0],[0,1],[-1,0]];
const DIRCH={u:0,r:1,d:2,l:3};
/* Tecken: # sten, T träd, ~ vatten, = bro, B monster, E laddstation, a äpple, S start, G flagga.
   Varje bana har en svårighet (Lätt/Medel/Svår), vilka kommandon som finns (F L R + J hoppa, X skjut)
   och ibland en energi (så många energienheter batteriet rymmer). */
const LEVELS=[
 {id:"forsta",tier:0,name:"Första steget",hint:"Tryck på Framåt några gånger och sedan på Kör. Ta äpplet på vägen!",cmds:"FLR",rows:[
  ".....",
  "S..aG",
  "....."]},
 {id:"svang",tier:0,name:"Sväng!",hint:"Roboten måste svänga för att komma till flaggan.",cmds:"FLR",rows:[
  "....G",
  ".....",
  "....a",
  ".....",
  "S...."]},
 {id:"stenmuren",tier:0,name:"Stenmuren",hint:"Hitta vägen runt muren av sten.",cmds:"FLR",rows:[
  "..#.G",
  "..#..",
  "S.#.a",
  "..#..",
  "....."]},
 {id:"bron",tier:0,name:"Bron",hint:"Roboten kan inte gå på vatten. Ta bron!",cmds:"FLR",rows:[
  "S..~.G",
  "...~..",
  "...~.a",
  "...=..",
  "...~.."]},
 {id:"hoppa",tier:0,name:"Hoppa!",hint:"Nytt: Hoppa tar roboten två rutor framåt, över en sten eller vatten. Träd och monster är för höga.",cmds:"FLRJ",rows:[
  "..T...",
  "S.#.aG",
  "..T..."]},
 {id:"laser",tier:0,name:"Monstret",hint:"Nytt: Ett monster 👾 står i vägen! Skjut skickar en laser rakt fram som skjuter bort monster. Den kortaste vägen går där monstret står.",cmds:"FLRJX",rows:[
  "T.....",
  "S.B.aG",
  "T....."]},
 {id:"batteriet",tier:1,name:"Batteriet",energy:6,hint:"Varje steg kostar energi. Kör över laddstationerna ⚡ så fylls batteriet igen!",cmds:"FLRJX",rows:[
  "S.a.E..",
  "TTTTTT.",
  "G...Ea."]},
 {id:"skogen",tier:1,name:"Skogen",energy:10,hint:"Mellan träd och stenar finns en väg. Håll koll på batteriet!",cmds:"FLRJX",rows:[
  "S.T...",
  "..T.#.",
  "..T.a.",
  "E...#.",
  "T#.T#.",
  "..a..G"]},
 {id:"alven",tier:1,name:"Älven",energy:11,hint:"Bron ligger långt bort. Kanske kan roboten hoppa över älven?",cmds:"FLRJX",rows:[
  "S.~....",
  "..~.Ta.",
  "..~.T..",
  ".a=...T",
  "..~.T..",
  "..~.TE.",
  "....#.G"]},
 {id:"ormen",tier:1,name:"Ormen",energy:10,hint:"Den långa vägen kräver för mycket energi. Hitta en genväg!",cmds:"FLRJX",rows:[
  "S..a..",
  "#####.",
  "......",
  ".#####",
  "....aG"]},
 {id:"lagret",tier:1,name:"Monstergrottan",energy:10,hint:"Monster överallt! Skjut bort dem som står i vägen, men lasern kostar också energi.",cmds:"FLRJX",rows:[
  "S.B..E",
  "TTB.T.",
  "a.B..B",
  ".TTT.B",
  "E...BG"]},
 {id:"aventyret",tier:2,name:"Stora äventyret",energy:9,hint:"Två äpplen att ta poäng för, lite energi och en lång väg. Tänk efter innan du kör!",cmds:"FLRJX",rows:[
  "S..~...",
  ".#.~.#.",
  ".#.=.#a",
  "a#.~.#.",
  ".#.E.#.",
  ".#.#.#B",
  "...#..G"]},
 {id:"fabriken",tier:2,name:"Robotfabriken",energy:12,hint:"Laddstationerna står utspridda. Planera vägen så att batteriet räcker hela vägen.",cmds:"FLRJX",rows:[
  "S..#..E",
  "TT.#.T.",
  "a..B.T.",
  "TT~TB..",
  "E..~..a",
  ".TT~TT.",
  "...E..G"]},
 {id:"mastarprovet",tier:2,name:"Mästarprovet",energy:9,hint:"Här finns allt: stenar, vatten, monster och laddstationer. Lycka till!",cmds:"FLRJX",rows:[
  "S.#.a.T",
  "TB#TT.~",
  "..E.B.~",
  "~~~T..E",
  "a.#..TB",
  ".T.TE~.",
  "E..#..G"]}
];
const TIERS=["Lätt","Medel","Svår"];
const BLOCK=new Set(['stone','tree','water','crate']);
const COST={F:1,J:2,X:1,L:0,R:0};
function parse(L){
  const rows=L.rows,h=rows.length,w=rows[0].length,cells=[],apples=[],crates=[];
  let start=null,goal=null;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x]; let t='grass';
    if(ch==='#')t='stone'; else if(ch==='T')t='tree'; else if(ch==='~')t='water';
    else if(ch==='=')t='bridge'; else if(ch==='E')t='charger';
    else if(ch==='B'){t='crate';crates.push({x,y});}
    else if(ch==='G'){t='goal';goal={x,y}}
    else if(ch==='S')start={x,y}; else if(ch==='a')apples.push({x,y});
    cells.push(t);
  }
  return {w,h,cells,start,goal,apples,crates,dir:DIRCH[L.dir||'r'],energy:L.energy||0,cmds:L.cmds||'FLR'};
}
/* Spelets regler, delade av spelet och lösaren. s = {x,y,d,crates(bitmask sprängda),energy} */
function inb(P,x,y){return x>=0&&y>=0&&x<P.w&&y<P.h;}
function crateAt(P,x,y,broken){const i=P.crates.findIndex(c=>c.x===x&&c.y===y);return i>=0&&!(broken&(1<<i))?i:-1;}
function cellAt(P,x,y){return P.cells[y*P.w+x];}
function canStand(P,x,y,broken){
  if(!inb(P,x,y))return false;const t=cellAt(P,x,y);
  if(t==='crate')return crateAt(P,x,y,broken)<0;
  return !BLOCK.has(t);
}
/* Returnerar {ok, x,y, why, hit(monster index), beam(längd)} */
function tryCmd(P,s,c){
  const [dx,dy]=DIRN[s.d];
  if(c==='F'){const x=s.x+dx,y=s.y+dy;if(canStand(P,x,y,s.broken))return {ok:true,x,y};return {ok:false,why:inb(P,x,y)&&crateAt(P,x,y,s.broken)>=0?'monster':'bump',x,y};}
  if(c==='J'){
    const mx=s.x+dx,my=s.y+dy,x=s.x+2*dx,y=s.y+2*dy;
    if(!inb(P,mx,my))return {ok:false,why:'edge'};
    const mt=cellAt(P,mx,my);
    if(mt==='tree'||crateAt(P,mx,my,s.broken)>=0)return {ok:false,why:'high'};
    if(!inb(P,x,y))return {ok:false,why:'edge'};
    if(!canStand(P,x,y,s.broken))return {ok:false,why:crateAt(P,x,y,s.broken)>=0?'monster':'land',x,y};
    return {ok:true,x,y};
  }
  if(c==='X'){
    let x=s.x,y=s.y,n=0;
    for(;;){
      x+=dx;y+=dy;
      if(!inb(P,x,y))return {ok:true,beam:n,hit:-1};
      const ci=crateAt(P,x,y,s.broken);
      if(ci>=0)return {ok:true,beam:n+1,hit:ci};
      const t=cellAt(P,x,y);
      if(t==='stone'||t==='tree')return {ok:true,beam:n+1,hit:-1,stop:true};
      n++;
    }
  }
  return {ok:true};
}
/* Kortaste lösning som tar alla äpplen. mode 'cmds' = minst antal kommandon, 'steps' = kortaste vägen i rutor
   (Framåt 1, Hoppa 2, svängar och laser 0). Hinkkö, eftersom kostnaderna är små heltal. */
function solve(P,mode){
  const full=(1<<P.apples.length)-1;
  const ai=new Map(P.apples.map((a,i)=>[a.y*P.w+a.x,i]));
  const E=P.energy, cmds=P.cmds.split('');
  const C=1<<P.crates.length;
  const W=mode==='steps'?{F:1,J:2,X:0,L:0,R:0}:{F:1,J:1,X:1,L:1,R:1};
  const key=(s)=>((((s.y*P.w+s.x)*4+s.d)*(full+1)+s.m)*C+s.broken)*(E+1)+s.e;
  const st={x:P.start.x,y:P.start.y,d:P.dir,m:0,broken:0,e:E,n:0,path:''};
  const done=new Set(),buckets=[[st]];
  for(let cost=0;cost<buckets.length;cost++){
    const b=buckets[cost];if(!b)continue;
    for(let i=0;i<b.length;i++){
      const s=b[i];const k0=key(s);if(done.has(k0))continue;done.add(k0);
      if(s.x===P.goal.x&&s.y===P.goal.y){ if(s.m===full)return {n:cost,path:s.path}; continue; }
      for(const c of cmds){
        const nx={...s,path:s.path+c};
        if(c==='L')nx.d=(s.d+3)%4;
        else if(c==='R')nx.d=(s.d+1)%4;
        else{
          if(E&&s.e<COST[c])continue;
          const r=tryCmd(P,s,c);if(!r.ok)continue;
          if(E)nx.e=s.e-COST[c];
          if(c==='X'){if(r.hit<0)continue;nx.broken=s.broken|(1<<r.hit);}
          else{
            nx.x=r.x;nx.y=r.y;
            const k=ai.get(r.y*P.w+r.x);if(k!==undefined)nx.m=s.m|(1<<k);
            if(E&&cellAt(P,r.x,r.y)==='charger')nx.e=E;
          }
        }
        if(done.has(key(nx)))continue;
        const nc=cost+W[c];(buckets[nc]||(buckets[nc]=[])).push(nx);
      }
    }
    buckets[cost]=null;
  }
  return null;
}
/*PURE-END*/

(function(){
const $=id=>document.getElementById(id);
const MAXLEN=40, STEP=520, KEY='robotresan-v2', OLDKEY='robotresan-v1';
const OLDIDS=['forsta','svang','stenmuren','bron','skogen','alven','ormen','aventyret'];
const PTS={goal:100,apple:50,path:100,prog:50};
const ICON={
  F:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4 11h5.5v10.5h5V11H20Z" fill="currentColor"/></svg>',
  L:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 22v-7a4.5 4.5 0 0 0-4.5-4.5H10v5L2.5 8.5 10 2v5h4.5A8.5 8.5 0 0 1 23 15.500V22Z" fill="currentColor"/></svg>',
  R:'<svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(24 0) scale(-1 1)"><path d="M19 22v-7a4.5 4.5 0 0 0-4.5-4.5H10v5L2.5 8.5 10 2v5h4.5A8.5 8.5 0 0 1 23 15.500V22Z" fill="currentColor"/></g></svg>',
  J:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20c1-9 5-14 9-14s8 5 9 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="3 3.2"/><path d="M17.5 16.5 21 21l1.5-5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="15" width="6" height="6" rx="1.5" fill="currentColor"/></svg>',
  X:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="8" height="6" rx="2" fill="currentColor"/><path d="M10 12h11" stroke="#ff2d55" stroke-width="3" stroke-linecap="round"/><path d="M19 7l3-2M19 17l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};
const SAYCMD={F:'Framåt',L:'Vänster',R:'Höger',J:'Hoppa',X:'Skjut'};
const BOT='<svg class="bot" viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="26" width="56" height="56" rx="14" fill="#ff7a3d" stroke="#12324a" stroke-width="5"/><rect x="30" y="38" width="40" height="22" rx="8" fill="#fff" stroke="#12324a" stroke-width="3"/><circle cx="41" cy="49" r="4.500" fill="#12324a"/><circle cx="59" cy="49" r="4.500" fill="#12324a"/><rect x="34" y="68" width="32" height="6" rx="3" fill="#12324a" opacity=".25"/><path d="M50 5 64 26H36Z" fill="#ffd23f" stroke="#12324a" stroke-width="4" stroke-linejoin="round"/></svg>';

let cur=0,P=null,prog=[],running=false,runId=0,sound=true;
let rb={x:0,y:0,d:0,ang:0,broken:0,e:0},got=new Set(),appleEl=[],crateEl=[],steps=0;
let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){saved=null;}
if(!saved||typeof saved!=='object'){
  saved={};
  /* Ta med stjärnorna från den gamla versionen av spelet. */
  try{const old=JSON.parse(localStorage.getItem(OLDKEY)||'{}')||{};
    OLDIDS.forEach((id,i)=>{if(old[i]>0)saved[id]={s:old[i],p:0};});}catch(e){}
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}}
const best=i=>saved[LEVELS[i].id]||{s:0,p:0};

let ac=null;
function tone(f,d,type,v){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=v||.07;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));o.stop(ac.currentTime+(d||.12));
  }catch(e){}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function say(t,kind){const m=$('msg');m.textContent=t;m.className='msg'+(kind?' '+kind:'');}

function totalScore(){return LEVELS.reduce((a,L,i)=>a+(best(i).p||0),0);}
function paintScore(){$('score').textContent='🏆 '+totalScore()+' poäng';}
function buildLevelBar(){
  const bar=$('levels');bar.innerHTML='';
  TIERS.forEach((tn,t)=>{
    const g=document.createElement('div');g.className='tier t'+t;
    g.innerHTML='<b>'+tn+'</b>';
    LEVELS.forEach((L,i)=>{
      if(L.tier!==t)return;
      const b=document.createElement('button');b.type='button';b.className='lvl';
      const s=best(i).s||0;
      b.innerHTML=(i+1)+'<span>'+'★'.repeat(s)+'☆'.repeat(3-s)+'</span>';
      b.setAttribute('aria-label','Bana '+(i+1)+', '+tn+', '+L.name+', '+s+' av 3 stjärnor');
      if(i===cur)b.setAttribute('aria-current','true');
      b.onclick=()=>{stopRun();loadLevel(i);};
      g.appendChild(b);
    });
    bar.appendChild(g);
  });
  paintScore();
}
function snapRobot(fn){
  const r=$('robot');r.classList.add('snap');fn();void r.offsetWidth;r.classList.remove('snap');
}
function paintRobot(){
  const r=$('robot');
  r.style.setProperty('--x',rb.x);r.style.setProperty('--y',rb.y);
  r.querySelector('.bot').style.transform='rotate('+rb.ang+'deg)';
}
function paintBattery(){
  if(!P.energy)return;
  const c=$('cells');
  [...c.children].forEach((el,i)=>el.classList.toggle('on',i<rb.e));
  c.classList.toggle('low',rb.e>0&&rb.e<=2);c.classList.toggle('empty',rb.e===0);
  c.setAttribute('aria-valuemax',P.energy);c.setAttribute('aria-valuenow',rb.e);
  c.setAttribute('aria-valuetext',rb.e+' av '+P.energy);
}
function paintCrates(){
  crateEl.forEach((el,i)=>{const gone=!!(rb.broken&(1<<i));el.textContent=gone?'':'👾';});
}
function resetRobot(){
  rb={x:P.start.x,y:P.start.y,d:P.dir,ang:P.dir*90,broken:0,e:P.energy};
  got=new Set();steps=0;
  appleEl.forEach(e=>e.classList.remove('gone'));
  const r=$('robot');r.classList.remove('empty','hop','bump');
  paintCrates();paintBattery();
  snapRobot(paintRobot);
}
function loadLevel(i){
  cur=i;const L=LEVELS[i];P=parse(L);
  const a=solve(P,'steps'),b=solve(P,'cmds');
  P.parSteps=a?a.n:Infinity;P.parCmds=b?b.n:Infinity;
  prog=[];$('win').hidden=true;
  $('lvlname').textContent='Bana '+(i+1)+' av '+LEVELS.length+' ('+TIERS[L.tier]+'): '+L.name;
  const bd=$('board');bd.innerHTML='';
  bd.style.setProperty('--w',P.w);bd.style.setProperty('--h',P.h);
  bd.setAttribute('aria-label','Spelplan, '+P.w+' gånger '+P.h+' rutor');
  appleEl=[];crateEl=[];
  const EM={stone:'🪨',tree:'🌲',water:'🌊',goal:'🏁',charger:'⚡'};
  for(let y=0;y<P.h;y++)for(let x=0;x<P.w;x++){
    const t=P.cells[y*P.w+x];const c=document.createElement('div');
    c.className='cell '+((x+y)%2?'g1':'g0');
    if(t!=='grass'&&t!=='crate')c.className='cell '+t;
    if(EM[t])c.textContent=EM[t];
    if(t==='charger')c.dataset.charger='1';
    const ai=P.apples.findIndex(a=>a.x===x&&a.y===y);
    if(ai>=0){const s=document.createElement('span');s.className='apple';s.textContent='🍎';c.appendChild(s);appleEl[ai]=s;}
    const ci=P.crates.findIndex(a=>a.x===x&&a.y===y);
    if(ci>=0)crateEl[ci]=c;
    c.id='c'+x+'_'+y;
    bd.appendChild(c);
  }
  const r=document.createElement('div');r.className='robot';r.id='robot';r.innerHTML=BOT;bd.appendChild(r);
  const has=t=>P.cells.includes(t);
  const lg=[];
  if(P.apples.length)lg.push(['🍎','Äpple: '+PTS.apple+' poäng']);
  if(has('charger'))lg.push(['⚡','Laddar batteriet']);
  if(P.crates.length)lg.push(['👾','Monster: skjut bort med lasern']);
  if(P.cmds.includes('J')&&(has('stone')||has('water')))lg.push(['🪨🌊','Hoppa över']);
  if(has('bridge'))lg.push(['🌉','Bron går att gå på']);
  $('legend').innerHTML=lg.map(x=>'<li><b aria-hidden="true">'+x[0]+'</b>'+x[1]+'</li>').join('');
  $('legend').hidden=!lg.length;
  $('battery').hidden=!P.energy;
  $('cells').innerHTML='<i></i>'.repeat(P.energy);
  document.querySelectorAll('.cmd').forEach(btn=>btn.hidden=!P.cmds.includes(btn.dataset.c));
  $('goals').textContent='Kortaste vägen: '+P.parSteps+' rutor. Kortaste programmet: '+P.parCmds+' kommandon.';
  resetRobot();renderProg();buildLevelBar();say(L.hint);setButtons();
}
function renderProg(active){
  const p=$('prog');p.innerHTML='';
  prog.forEach((c,i)=>{
    const d=document.createElement('div');d.className='chip '+c+(i===active?' on':'');d.innerHTML=ICON[c];
    d.setAttribute('role','img');d.setAttribute('aria-label',SAYCMD[c]);p.appendChild(d);
  });
}
function setButtons(){
  const run=$('run');
  run.textContent=running?'Stopp':'Kör';run.classList.toggle('stop',running);
  run.disabled=!running&&prog.length===0;
  document.querySelectorAll('.cmd,#undo,#clear').forEach(b=>b.disabled=running);
}
function add(c){
  if(running||!P.cmds.includes(c))return;
  if(prog.length>=MAXLEN){say('Programmet är fullt. Ta bort något eller tryck på Kör.','bad');return;}
  prog.push(c);tone({F:520,L:440,R:620,J:700,X:780}[c],.09);renderProg();setButtons();
  if(prog.length===1)say('Bra! Fortsätt tills roboten når flaggan, tryck sedan på Kör.');
}
function stopRun(){runId++;running=false;renderProg();setButtons();if(P)resetRobot();}

function popup(x,y,text,cls){
  const el=document.createElement('div');el.className='pop '+(cls||'');el.textContent=text;
  el.style.left=((x+.5)/P.w*100)+'%';el.style.top=((y+.3)/P.h*100)+'%';
  $('board').appendChild(el);setTimeout(()=>el.remove(),1100);
}
function shootBeam(r){
  const bd=$('board'),el=document.createElement('div');el.className='beam';
  const len=(r.hit>=0||r.stop)?r.beam-.35:r.beam+.5;
  el.style.left=((rb.x+.5)/P.w*100)+'%';el.style.top=((rb.y+.5)/P.h*100)+'%';
  el.style.width=(Math.max(len,.3)/P.w*100)+'%';
  el.style.transform='translateY(-50%) rotate('+[-90,0,90,180][rb.d]+'deg)';
  bd.appendChild(el);setTimeout(()=>el.remove(),500);
}
async function fail(my,text,cls){
  const r=$('robot');r.classList.add(cls||'bump');
  await sleep(cls==='empty'?650:450);r.classList.remove('bump');
  if(my!==runId)return;
  running=false;renderProg();setButtons();
  say(text,'bad');
  await sleep(1100);if(my!==runId)return;resetRobot();
}
async function run(){
  if(running){stopRun();say('Stoppad. Ändra programmet och prova igen.');return;}
  if(!prog.length)return;
  resetRobot();running=true;const my=++runId;setButtons();say('Roboten kör!');
  await sleep(250);
  const total=P.apples.length;
  for(let i=0;i<prog.length;i++){
    if(my!==runId)return;
    renderProg(i);const c=prog[i];
    if(c==='L'){rb.d=(rb.d+3)%4;rb.ang-=90;tone(440,.1);paintRobot();}
    else if(c==='R'){rb.d=(rb.d+1)%4;rb.ang+=90;tone(620,.1);paintRobot();}
    else{
      if(P.energy&&rb.e<COST[c]){
        tone(220,.25,'sawtooth',.05);setTimeout(()=>tone(150,.35,'sawtooth',.05),200);
        return fail(my,'Batteriet tog slut! '+(c==='J'?'Ett hopp kostar 2 energi. ':'')+(P.cells.includes('charger')?'Kör via en laddstation ⚡ eller hitta en kortare väg.':'Här finns ingen laddstation, så du måste hitta en kortare väg.'),'empty');
      }
      const r=tryCmd(P,rb,c);
      if(!r.ok){
        tone(150,.3,'square',.05);
        const t={bump:'Hoppsan! Roboten krockade. Titta på programmet och ändra det.',
          monster:'Ett monster står i vägen! Skjut bort det med lasern först.',
          high:'Det är för högt! Roboten kan inte hoppa över träd och monster. Monster skjuter du bort med lasern.',
          land:'Roboten kan inte landa där. Den måste landa på en tom ruta.',
          edge:'Roboten kan inte hoppa utanför banan.'}[r.why];
        return fail(my,t);
      }
      if(P.energy){rb.e-=COST[c];paintBattery();}
      if(c==='X'){
        tone(1200,.18,'sawtooth',.04);setTimeout(()=>tone(700,.12,'sawtooth',.03),90);
        shootBeam(r);
        if(r.hit>=0){
          const k=r.hit;rb.broken|=(1<<k);const mc=P.crates[k];
          setTimeout(()=>{const el=crateEl[k];el.innerHTML='<span class="boom">💥</span>';popup(mc.x,mc.y,'Pang!');tone(90,.35,'square',.07);
            setTimeout(()=>{if(rb.broken&(1<<k))el.textContent='';},500);},220);
        }
      }else{
        const r2=$('robot');
        if(c==='J'){r2.classList.remove('hop');void r2.offsetWidth;r2.classList.add('hop');tone(400,.08);setTimeout(()=>tone(800,.12,'triangle'),150);}
        else tone(520,.08);
        rb.x=r.x;rb.y=r.y;steps+=c==='J'?2:1;paintRobot();
        const k=P.apples.findIndex(a=>a.x===r.x&&a.y===r.y);
        if(k>=0&&!got.has(k)){got.add(k);setTimeout(()=>{appleEl[k].classList.add('gone');tone(880,.15,'triangle');popup(r.x,r.y,'+'+PTS.apple,'pts');},300);}
        if(P.energy&&cellAt(P,r.x,r.y)==='charger'){
          rb.e=P.energy;
          setTimeout(()=>{paintBattery();popup(r.x,r.y,'⚡ Fullt!','volt');const el=$('c'+r.x+'_'+r.y);el.classList.remove('zap');void el.offsetWidth;el.classList.add('zap');
            [660,880,1100].forEach((f,j)=>setTimeout(()=>tone(f,.1,'triangle',.05),j*70));},350);
        }
        if(r.x===P.goal.x&&r.y===P.goal.y){await sleep(STEP);if(my!==runId)return;win(total);return;}
      }
    }
    await sleep(c==='J'?STEP+120:STEP);
  }
  if(my!==runId)return;
  running=false;renderProg();setButtons();
  say('Roboten stannade innan flaggan. Lägg till fler kommandon eller ändra något.','bad');
  await sleep(900);if(my!==runId)return;resetRobot();
}
function win(total){
  running=false;renderProg();setButtons();
  const all=got.size===total;
  const shortPath=all&&steps<=P.parSteps, shortProg=all&&prog.length<=P.parCmds;
  const s=1+(all?1:0)+(shortPath?1:0);
  const rows=[['Flaggan',PTS.goal,true]];
  if(total)rows.push(['Äpplen '+got.size+' av '+total,PTS.apple*got.size,got.size>0]);
  rows.push(['Kortaste vägen ('+steps+' rutor)',shortPath?PTS.path:0,shortPath]);
  rows.push(['Kortaste programmet ('+prog.length+' kommandon)',shortProg?PTS.prog:0,shortProg]);
  const p=rows.reduce((a,r)=>a+r[1],0);
  const old=best(cur),rec=p>(old.p||0);
  saved[LEVELS[cur].id]={s:Math.max(s,old.s||0),p:Math.max(p,old.p||0)};persist();
  if(window.Spelhornan)Spelhornan.rapportera('robotresan','bana-'+LEVELS[cur].id,{poang:s,max:3,namn:'Bana '+(cur+1)+': '+LEVELS[cur].name});
  buildLevelBar();
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.08),i*130));
  $('wstars').innerHTML=[0,1,2].map(i=>'<i class="'+(i<s?'':'off')+'">★</i>').join('');
  $('wpts').innerHTML=rows.map(r=>'<li class="'+(r[2]?'':'miss')+'"><span>'+r[0]+'</span><span>+'+r[1]+'</span></li>').join('')
    +'<li class="sum"><span>Summa'+(rec&&old.p?' (nytt rekord!)':'')+'</span><span>'+p+' poäng</span></li>';
  let t;
  if(!all)t='Varje äpple ger '+PTS.apple+' poäng. Kan du ta alla nästa gång?';
  else if(!shortPath)t='Det finns en kortare väg: '+P.parSteps+' rutor. Kan du hitta den?';
  else if(!shortProg)t='Kortaste vägen! Kan du göra programmet ännu kortare? Det går med '+P.parCmds+' kommandon.';
  else t='Kortaste vägen och kortaste programmet. Fantastiskt!';
  const last=cur===LEVELS.length-1;
  if(last&&s===3)t='Du klarade sista banan. Du är en riktig robotprogrammerare!';
  $('wtext').textContent=t;
  $('wnext').hidden=last;
  $('win').hidden=false;
  say('Roboten kom fram till flaggan!','good');
  $('wnext').hidden?$('wagain').focus():$('wnext').focus();
}

document.querySelectorAll('.cmd').forEach(b=>{
  b.querySelector('[data-i]').innerHTML=ICON[b.dataset.c];
  b.onclick=()=>add(b.dataset.c);
});
$('run').onclick=run;
$('undo').onclick=()=>{if(!running&&prog.length){prog.pop();renderProg();setButtons();}};
$('clear').onclick=()=>{if(!running){prog=[];renderProg();setButtons();say(LEVELS[cur].hint);}};
$('wnext').onclick=()=>loadLevel(Math.min(cur+1,LEVELS.length-1));
$('wagain').onclick=()=>{prog=[];$('win').hidden=true;resetRobot();renderProg();setButtons();say(LEVELS[cur].hint);};
$('snd').onclick=function(){sound=!sound;this.setAttribute('aria-pressed',String(sound));this.textContent=sound?'Ljud på':'Ljud av';};
const sp=$('speak');
if(!('speechSynthesis' in window))sp.hidden=true;
sp.onclick=()=>{
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(LEVELS[cur].name+'. '+LEVELS[cur].hint.replace(/⚡|👾/gu,''));u.lang='sv-SE';u.rate=.9;
    speechSynthesis.speak(u);
  }catch(e){}
};
document.addEventListener('keydown',e=>{
  if(!$('win').hidden)return;
  const k={ArrowUp:'F',ArrowLeft:'L',ArrowRight:'R',ArrowDown:'J',h:'J',s:'X',' ':'X'}[e.key];
  if(k&&e.target.tagName!=='BUTTON'||k&&k!=='X'){add(k);e.preventDefault();}
  else if(e.key==='Backspace'&&e.target.tagName!=='INPUT'){$('undo').click();e.preventDefault();}
  else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){run();}
});
let first=0;
for(let i=0;i<LEVELS.length;i++){if(!(best(i).s>0)){first=i;break;}first=i;}
loadLevel(first);
})();
