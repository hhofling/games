<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff1ff">
<title>Ordmemory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Memory där ett ord och en bild bildar ett par. Teman och ord finns i TEMAN längre ner. */
:root{
  --bg:#dff1ff; --ink:#12324a; --muted:#46647c; --card:#ffffff; --edge:#2b5d82; --line:#b3d4ec;
  --go:#22a152; --accent:#ff7a3d; --gold:#ffc21a; --shadow:rgba(18,50,74,.22);
  --back:#58b0ff; --back2:#4aa3f2; --word:#fff4d6; --wordedge:#e0a400;
  --font:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.35;
  padding-block:16px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:4px solid var(--accent); outline-offset:2px}
.wrap{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px}
h1{font-size:2rem; font-weight:700; margin:0}
h1 a{color:inherit; text-decoration:none}
h1 small{display:block; font-size:1rem; font-weight:500; color:var(--muted)}
.tools{display:flex; flex-wrap:wrap; gap:8px}
.small-btn{min-height:44px; padding:6px 14px; border-radius:12px; border:3px solid var(--edge); background:var(--card); font-size:1rem; font-weight:600; box-shadow:0 3px 0 var(--shadow)}
.small-btn[aria-pressed="false"]{opacity:.6}

.bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.bar .lbl{font-weight:600; color:var(--muted); font-size:1rem; margin-right:2px; min-width:3.2em}
.pick{min-height:52px; padding:4px 14px; border-radius:14px; border:3px solid var(--edge); background:var(--card); font-weight:600; font-size:1.05rem; line-height:1.1; box-shadow:0 3px 0 var(--shadow)}
.pick .em{font-size:1.4rem; margin-right:4px; vertical-align:-2px}
.pick span.st{display:block; font-size:.78rem; color:var(--gold); letter-spacing:.08em; -webkit-text-stroke:.5px var(--edge)}
.pick[aria-pressed="true"]{background:var(--accent); color:#2a1200}
.pick[aria-pressed="true"] span.st{color:#fff}

.status{display:flex; flex-wrap:wrap; gap:8px 18px; font-weight:600; color:var(--muted)}
.status b{color:var(--ink)}

.board-wrap{position:relative}
.board{
  display:grid; gap:10px; grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  max-width:calc(var(--cols) * 150px); margin:0 auto;
}
.card{
  position:relative; aspect-ratio:3/4; padding:0; border:0; background:none; perspective:700px;
  container-type:inline-size;
}
.card .in{position:absolute; inset:0; transition:transform .45s; transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; display:grid; place-items:center; border-radius:16px; border:4px solid var(--edge);
  backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 5px 0 var(--shadow); overflow:hidden;
}
.back{
  background:repeating-linear-gradient(45deg,var(--back) 0 12px,var(--back2) 12px 24px);
  color:#fff; font-size:44cqw; font-weight:700; -webkit-text-stroke:2px var(--edge);
}
.front{transform:rotateY(180deg); background:var(--card)}
.front.pic{font-size:58cqw; line-height:1}
.front.word{background:var(--word); border-color:var(--wordedge); font-weight:700; padding:4px; text-align:center; line-height:1.05; white-space:nowrap}
.card.done .front{border-color:var(--go); background:#d9f5df}
.card.done .in{animation:joy .5s}
.card.miss .front{border-color:#d9442b}
.card:not(.up):hover .in{transform:translateY(-3px)}
.card:not(.up):active .back{box-shadow:0 2px 0 var(--shadow)}
@keyframes joy{0%,100%{scale:1} 50%{scale:1.08}}

.msg{margin:0 2px; min-height:1.6em; font-weight:500; font-size:1.1rem; text-align:center}
.msg.bad{color:#a8330a} .msg.good{color:#0f6b34}

.win{position:absolute; inset:-6px; display:grid; place-items:center; padding:14px; background:rgba(18,50,74,.6); border-radius:20px}
.win[hidden]{display:none}
.win-card{background:var(--card); border:4px solid var(--edge); border-radius:22px; padding:18px 20px; text-align:center; max-width:360px; width:100%}
.win-card h2{margin:0; font-size:1.8rem}
.stars{font-size:2.6rem; letter-spacing:.1em; color:var(--gold); -webkit-text-stroke:1.5px var(--edge); margin:4px 0}
.stars i{font-style:normal; display:inline-block; animation:pop .5s both}
.stars i:nth-child(2){animation-delay:.15s} .stars i:nth-child(3){animation-delay:.3s}
.stars i.off{color:#e3edf5; animation:none}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)} 70%{transform:scale(1.3) rotate(8deg)} 100%{transform:scale(1)}}
.win-card p{margin:6px 0 12px; font-size:1.05rem}
.win-btns{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.win-btns .go{background:var(--go); color:#fff; border-color:#0d5a2e}

@media (max-width:600px){
  h1{font-size:1.6rem}
  .board{gap:7px}
  .face{border-width:3px; border-radius:12px}
}
@media (prefers-reduced-motion:reduce){
  .card .in{transition:none}
  .card.done .in,.stars i{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="index.html" aria-label="Till Spelhörnan">Ordmemory</a> <small>Hitta ordet och bilden som hör ihop</small></h1>
    <div class="tools">
      <button class="small-btn" id="caps" type="button" aria-pressed="false">ABC</button>
      <button class="small-btn" id="speak" type="button">Läs upp</button>
      <button class="small-btn" id="snd" type="button" aria-pressed="true">Ljud på</button>
    </div>
  </header>
  <nav class="bar" id="themes" aria-label="Välj tema"><span class="lbl">Tema</span></nav>
  <nav class="bar" id="sizes" aria-label="Välj svårighet"><span class="lbl">Nivå</span></nav>
  <div class="status" aria-live="polite"><span>Par: <b id="pairs">0</b></span><span>Försök: <b id="tries">0</b></span></div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="win" id="win" hidden>
      <div class="win-card" role="dialog" aria-labelledby="wt">
        <h2 id="wt">Bra jobbat!</h2>
        <div class="stars" id="wstars"></div>
        <p id="wtext"></p>
        <div class="win-btns">
          <button class="small-btn go" id="wagain" type="button">Spela igen</button>
          <button class="small-btn" id="wnext" type="button">Svårare</button>
        </div>
      </div>
    </div>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>
</div>

<script>
/* Lägg till ett nytt tema genom att kopiera ett block och byta ut orden.
   Varje rad är [ord, bild]. Bilden är en emoji. Ett tema behöver minst 8 ord. */
const TEMAN=[
  {namn:"Mat", ikon:"🍕", ord:[
    ["pizza","🍕"],["banan","🍌"],["äpple","🍎"],["glass","🍦"],["morot","🥕"],["ost","🧀"],
    ["bröd","🍞"],["ägg","🥚"],["jordgubbe","🍓"],["druvor","🍇"],["päron","🍐"],["citron","🍋"],
    ["melon","🍉"],["korv","🌭"],["hamburgare","🍔"],["pannkaka","🥞"],["mjölk","🥛"],["tårta","🎂"],
    ["kaka","🍪"],["majs","🌽"],["tomat","🍅"],["gurka","🥒"],["broccoli","🥦"],["potatis","🥔"],
    ["godis","🍬"],["popcorn","🍿"],["apelsin","🍊"],["körsbär","🍒"],["smörgås","🥪"],["soppa","🍲"],
    ["choklad","🍫"],["munk","🍩"],["ris","🍚"],["kyckling","🍗"]
  ]},
  {namn:"Djur", ikon:"🐱", ord:[
    ["katt","🐱"],["hund","🐶"],["ko","🐮"],["gris","🐷"],["häst","🐴"],["får","🐑"],["höna","🐔"],
    ["anka","🦆"],["fisk","🐟"],["groda","🐸"],["elefant","🐘"],["lejon","🦁"],["apa","🐒"],["björn","🐻"],
    ["kanin","🐰"],["mus","🐭"],["uggla","🦉"],["orm","🐍"],["giraff","🦒"],["zebra","🦓"],["igelkott","🦔"],
    ["räv","🦊"],["fjäril","🦋"],["snigel","🐌"],["bi","🐝"],["nyckelpiga","🐞"],["pingvin","🐧"],["val","🐳"]
  ]},
  {namn:"Fordon", ikon:"🚗", ord:[
    ["bil","🚗"],["buss","🚌"],["tåg","🚆"],["flygplan","✈️"],["segelbåt","⛵"],["cykel","🚲"],["traktor","🚜"],
    ["helikopter","🚁"],["raket","🚀"],["lastbil","🚚"],["brandbil","🚒"],["polisbil","🚓"],["ambulans","🚑"],
    ["motorcykel","🏍️"],["sparkcykel","🛴"],["taxi","🚕"],["fartyg","🚢"]
  ]}
];
const NIVAER=[{namn:"Lätt",par:4,kol:4},{namn:"Mellan",par:6,kol:4},{namn:"Svår",par:8,kol:4}];
const KEY='ordmemory-v1';

(function(){
const $=id=>document.getElementById(id);
let tema=0,niva=0,cards=[],open=[],lock=false,tries=0,found=0,sound=true,caps=false,t0=0,started=false;
let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){saved={};}
if(typeof saved.caps==='boolean')caps=saved.caps;
if(Number.isInteger(saved.tema)&&TEMAN[saved.tema])tema=saved.tema;
if(Number.isInteger(saved.niva)&&NIVAER[saved.niva])niva=saved.niva;
saved.stj=saved.stj||{};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}}

let ac=null;
function tone(f,d,type,v){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=v||.07;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));o.stop(ac.currentTime+(d||.12));
  }catch(e){}
}
function speak(t){
  if(!sound||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sv-SE';u.rate=.85;speechSynthesis.speak(u);}catch(e){}
}
function say(t,kind){const m=$('msg');m.textContent=t;m.className='msg'+(kind?' '+kind:'');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const skey=()=>tema+'-'+niva;
const starStr=s=>'★'.repeat(s)+'☆'.repeat(3-s);
const show=w=>caps?w.toLocaleUpperCase('sv-SE'):w;

function buildBars(){
  const tb=$('themes');tb.querySelectorAll('button').forEach(b=>b.remove());
  TEMAN.forEach((T,i)=>{
    const b=document.createElement('button');b.type='button';b.className='pick';
    b.innerHTML='<span class="em" aria-hidden="true">'+T.ikon+'</span>'+T.namn;
    b.setAttribute('aria-pressed',String(i===tema));
    b.onclick=()=>{tema=i;newGame();};
    tb.appendChild(b);
  });
  const sb=$('sizes');sb.querySelectorAll('button').forEach(b=>b.remove());
  NIVAER.forEach((N,i)=>{
    const s=saved.stj[tema+'-'+i]||0;
    const b=document.createElement('button');b.type='button';b.className='pick';
    b.innerHTML=N.namn+'<span class="st">'+starStr(s)+'</span>';
    b.setAttribute('aria-label',N.namn+', '+N.par+' par, '+s+' av 3 stjärnor');
    b.setAttribute('aria-pressed',String(i===niva));
    b.onclick=()=>{niva=i;newGame();};
    sb.appendChild(b);
  });
}

function newGame(){
  saved.tema=tema;saved.niva=niva;persist();
  buildBars();
  const T=TEMAN[tema],N=NIVAER[niva];
  const words=shuffle(T.ord.slice()).slice(0,N.par);
  cards=[];
  words.forEach((w,id)=>{cards.push({id,ord:w[0],bild:w[1],typ:'word'});cards.push({id,ord:w[0],bild:w[1],typ:'pic'});});
  shuffle(cards);
  open=[];lock=false;tries=0;found=0;started=false;
  $('win').hidden=true;
  const board=$('board');board.innerHTML='';
  const cols=window.innerWidth<480&&N.par>4?(N.par===6?3:4):N.kol;
  board.style.setProperty('--cols',cols);
  cards.forEach((c,i)=>{
    const b=document.createElement('button');b.type='button';b.className='card';
    b.setAttribute('aria-label','Kort '+(i+1));
    b.innerHTML='<div class="in"><div class="face back" aria-hidden="true">?</div><div class="face front '+c.typ+'" aria-hidden="true"></div></div>';
    c.el=b;fillFront(c);
    b.onclick=()=>flip(i);
    board.appendChild(b);
  });
  updStatus();
  say('Vänd två kort. Hitta ordet och bilden som hör ihop!');
}
function fillFront(c){
  const f=c.el.querySelector('.front');
  if(c.typ==='pic'){f.textContent=c.bild;return;}
  const w=show(c.ord);f.textContent=w;
  /* Långa ord får mindre text så att de ryms på kortet. */
  const n=Math.max(w.length,3);f.style.fontSize=Math.min(caps?30:36,(caps?118:150)/n)+'cqw';
}
function updStatus(){$('pairs').textContent=found+' av '+cards.length/2;$('tries').textContent=tries;}

function flip(i){
  const c=cards[i];
  if(lock||c.up||c.done)return;
  if(!started){started=true;t0=Date.now();}
  c.up=true;c.el.classList.add('up');
  c.el.setAttribute('aria-label',(c.typ==='pic'?'Bild: ':'Ord: ')+c.ord);
  tone(c.typ==='pic'?520:660,.09,'triangle');
  if(c.typ==='word')speak(c.ord);
  open.push(c);
  if(open.length<2)return;
  tries++;
  const [a,b]=open;open=[];
  if(a.id===b.id&&a.typ!==b.typ){
    found++;
    a.done=b.done=true;
    setTimeout(()=>{
      a.el.classList.add('done');b.el.classList.add('done');
      a.el.disabled=b.el.disabled=true;
      tone(660,.1);setTimeout(()=>tone(880,.16),110);
      speak(a.ord);
      say(a.bild+' '+show(a.ord)+'. Rätt!','good');
      updStatus();
      if(found===cards.length/2)setTimeout(win,700);
    },350);
  }else{
    lock=true;
    updStatus();
    say(a.typ===b.typ?(a.typ==='pic'?'Två bilder. Leta efter ett ord och en bild!':'Två ord. Leta efter ett ord och en bild!'):'De hör inte ihop. Försök igen!','bad');
    setTimeout(()=>{a.el.classList.add('miss');b.el.classList.add('miss');tone(220,.18,'sawtooth',.04);},450);
    setTimeout(()=>{
      for(const c of [a,b]){c.up=false;c.el.classList.remove('up','miss');c.el.setAttribute('aria-label','Kort '+(cards.indexOf(c)+1));}
      lock=false;
    },1500);
  }
}

function win(){
  const par=cards.length/2;
  const stars=tries<=Math.ceil(par*1.5)?3:tries<=par*2+1?2:1;
  const k=skey();
  if(stars>(saved.stj[k]||0)){saved.stj[k]=stars;persist();}
  buildBars();
  const sek=Math.round((Date.now()-t0)/1000);
  $('wstars').innerHTML=[0,1,2].map(i=>'<i'+(i<stars?'':' class="off"')+'>★</i>').join('');
  $('wtext').textContent='Du hittade alla '+par+' par på '+tries+' försök.';
  $('wnext').hidden=niva>=NIVAER.length-1;
  $('win').hidden=false;
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*130));
  say('Alla par hittade!','good');
  $('wagain').focus();
  /* Gemensam topplista: används bara om spelhornan.js finns på sidan. */
  try{
    if(window.Spelhornan&&Spelhornan.rapportera)
      Spelhornan.rapportera('ordmemory',TEMAN[tema].namn+' '+NIVAER[niva].namn,{poang:Math.round(100*par/tries),max:100,tid:sek});
  }catch(e){}
}

$('wagain').onclick=newGame;
$('wnext').onclick=()=>{niva=Math.min(niva+1,NIVAER.length-1);newGame();};
$('snd').onclick=function(){sound=!sound;this.setAttribute('aria-pressed',String(sound));this.textContent=sound?'Ljud på':'Ljud av';if(!sound&&'speechSynthesis' in window)speechSynthesis.cancel();};
const capsBtn=$('caps');
function setCaps(){capsBtn.setAttribute('aria-pressed',String(caps));capsBtn.textContent=caps?'ABC':'abc';capsBtn.title=caps?'Stora bokstäver':'Små bokstäver';cards.forEach(c=>{if(c.el)fillFront(c);});}
capsBtn.onclick=()=>{caps=!caps;saved.caps=caps;persist();setCaps();};
const sp=$('speak');
if(!('speechSynthesis' in window))sp.hidden=true;
sp.onclick=()=>{
  const s=sound;sound=true;
  speak('Ordmemory. Vänd två kort i taget. Hitta ordet och bilden som hör ihop. Tema: '+TEMAN[tema].namn+'.');
  sound=s;
};
newGame();
setCaps();
})();
</script>
</body>
</html>
