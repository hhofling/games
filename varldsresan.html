<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff1ff">
<title>Världsresan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: världsdel och spel överst, kartan till vänster, frågan och svaren till höger. En kolumn på telefon. */
:root{
  --bg:#dff1ff; --ink:#12324a; --muted:#46647c; --card:#ffffff; --edge:#2b5d82; --line:#b3d4ec;
  --sea:#a9d8f5; --other:#e6dfcf; --go:#22a152; --bad:#e0563b; --accent:#ff7a3d; --gold:#ffc21a;
  --shadow:rgba(18,50,74,.22);
  --font:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.35;
  padding-block:16px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:4px solid var(--accent); outline-offset:2px}
button:disabled{opacity:.45; cursor:not-allowed}
.wrap{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px 22px}
header{grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px}
h1{font-size:2rem; font-weight:700; margin:0}
h1 small{display:block; font-size:1rem; font-weight:500; color:var(--muted)}
.tools{display:flex; gap:8px}
.small-btn{min-height:44px; padding:6px 14px; border-radius:12px; border:3px solid var(--edge); background:var(--card); font-size:1rem; font-weight:600; box-shadow:0 3px 0 var(--shadow)}
.small-btn[aria-pressed="false"]{opacity:.6}

.pick{grid-column:1/-1; display:flex; flex-direction:column; gap:8px}
.row{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:52px; padding:4px 12px; border-radius:14px; border:3px solid var(--edge); background:var(--card); font-weight:600; font-size:1.05rem; line-height:1.1; box-shadow:0 3px 0 var(--shadow); display:flex; align-items:center; gap:6px}
.chip .em{font-size:1.4rem}
.chip .st{font-size:.8rem; color:var(--gold); letter-spacing:.06em; -webkit-text-stroke:.5px var(--edge)}
.chip[aria-pressed="true"]{background:var(--accent); color:#2a1200}
.chip[aria-pressed="true"] .st{color:#fff}

.stage{min-width:0}
.ask{min-height:2.6em; margin:0 0 8px; font-size:1.35rem; font-weight:600; display:flex; align-items:center; gap:10px}
.ask img{height:1.6em; border:2px solid var(--edge); border-radius:4px}
.map-wrap{position:relative; background:var(--sea); border:5px solid var(--edge); border-radius:20px; overflow:hidden; box-shadow:0 5px 0 var(--shadow)}
#map{display:block; width:100%; height:auto; max-height:72vh; touch-action:pan-y; user-select:none; -webkit-user-select:none}
#map.zoomed{touch-action:none; cursor:grab}
#map .land{stroke:#fff; stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; transition:fill .2s}
#map .ctx{fill:var(--other); stroke:#fff; stroke-width:.8; vector-effect:non-scaling-stroke}
#map .dot{stroke:var(--edge); stroke-width:1.5; vector-effect:non-scaling-stroke}
#map .hit{fill:transparent}
#map .c0{fill:#ffe08a} #map .c1{fill:#b5e08f} #map .c2{fill:#f8b994} #map .c3{fill:#d9c2f0} #map .c4{fill:#f5a6b8}
#map.can-tap .land{cursor:pointer}
@media (hover:hover){#map.can-tap .land:hover{fill:#fff6d0}}
#map .land.sel,#map .land.target{fill:var(--accent)}
#map .land.ok{fill:var(--go)}
#map .land.no{fill:var(--bad)}
#map .ring{fill:none; stroke:var(--accent); stroke-width:4; vector-effect:non-scaling-stroke; animation:ring 1.2s ease-in-out infinite}
#map .ring.ok{stroke:var(--go)}
@keyframes ring{0%,100%{opacity:1} 50%{opacity:.25}}
.zoom{position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:6px}
.zoom button{width:44px; height:44px; border-radius:12px; border:3px solid var(--edge); background:var(--card); font-size:1.4rem; font-weight:700; line-height:1; box-shadow:0 3px 0 var(--shadow)}
.zoom button.txt{font-size:.85rem}
.credit{margin:6px 2px 0; font-size:.8rem; color:var(--muted)}

.panel{min-width:0; display:flex; flex-direction:column; gap:12px}
.score{display:flex; justify-content:space-between; align-items:center; font-weight:600; color:var(--muted)}
.dots{display:flex; gap:4px; flex-wrap:wrap}
.dots i{width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid var(--line)}
.dots i.ok{background:var(--go); border-color:#0d5a2e}
.dots i.no{background:var(--bad); border-color:#7d1f0e}
.dots i.now{border-color:var(--accent); border-width:3px}
.bigflag{display:block; width:100%; max-width:320px; margin:0 auto; aspect-ratio:4/3; object-fit:cover; border:3px solid var(--edge); border-radius:10px; background:#fff; box-shadow:0 4px 0 var(--shadow)}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opt{min-height:68px; padding:8px; border-radius:18px; border:3px solid var(--edge); background:var(--card); font-size:1.15rem; font-weight:600; box-shadow:0 5px 0 var(--shadow); overflow-wrap:break-word; hyphens:auto}
.opt:active{transform:translateY(3px); box-shadow:0 2px 0 var(--shadow)}
.opt.ok{background:var(--go); color:#fff; border-color:#0d5a2e}
.opt.no{background:var(--bad); color:#fff; border-color:#7d1f0e}
.opt:disabled{opacity:1; cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.5}
.info{background:var(--card); border:3px solid var(--edge); border-radius:18px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start}
.info img{width:84px; flex:none; aspect-ratio:4/3; object-fit:cover; border:2px solid var(--edge); border-radius:6px}
.info b{display:block; font-size:1.3rem}
.info p{margin:2px 0 0; font-size:1rem}
.info .note{color:var(--muted)}
.msg{min-height:1.4em; margin:0; font-weight:500; font-size:1.1rem}
.msg.bad{color:#a8330a} .msg.good{color:#0f6b34}
.next{min-height:60px; border-radius:18px; border:3px solid #0d5a2e; background:var(--go); color:#fff; font-size:1.4rem; font-weight:700; box-shadow:0 5px 0 #0d5a2e}
.next:active{transform:translateY(3px); box-shadow:0 2px 0 #0d5a2e}
.next[hidden]{display:none}
.ask-flag{display:none; margin:0; font-size:1.15rem; font-weight:600}
@media (max-width:760px){.ask-flag{display:block}}

.win{position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:rgba(18,50,74,.6); z-index:5}
.win[hidden]{display:none}
.win-card{background:var(--card); border:4px solid var(--edge); border-radius:22px; padding:18px 20px; text-align:center; max-width:380px; width:100%}
.win-card h2{margin:0; font-size:1.8rem}
.stars{font-size:2.6rem; letter-spacing:.1em; color:var(--gold); -webkit-text-stroke:1.5px var(--edge); margin:4px 0}
.stars i{font-style:normal; display:inline-block; animation:pop .5s both}
.stars i:nth-child(2){animation-delay:.15s} .stars i:nth-child(3){animation-delay:.3s}
.stars i.off{color:#e3edf5; animation:none}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)} 70%{transform:scale(1.3) rotate(8deg)} 100%{transform:scale(1)}}
.win-card p{margin:6px 0 12px; font-size:1.05rem}
.win-btns{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.win-btns .go{background:var(--go); color:#fff; border-color:#0d5a2e}

@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.6rem}
  .row{flex-wrap:nowrap; overflow-x:auto; margin-inline:-4px; padding:0 4px 6px; scrollbar-width:thin}
  .chip{flex:none; min-height:46px; font-size:.95rem; padding:3px 9px}
  .ask{font-size:1.15rem}
  #map{max-height:60vh}
  .wrap.flagmode .stage{order:1}
  .wrap.flagmode .stage .ask{display:none}
  .opt{font-size:1.05rem}
  .bigflag{max-width:240px}
}
@media (prefers-reduced-motion:reduce){
  #map .ring,.stars i{animation:none}
  #map .land{transition:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Världsresan <small>Lär dig länder, huvudstäder och flaggor</small></h1>
    <div class="tools">
      <button class="small-btn" id="speak" type="button">Läs upp</button>
      <button class="small-btn" id="snd" type="button" aria-pressed="true">Ljud på</button>
      <span id="spelarplats"></span>
    </div>
  </header>

  <div class="pick">
    <nav class="row" id="conts" aria-label="Välj världsdel"></nav>
    <nav class="row" id="modes" aria-label="Välj spel"></nav>
  </div>

  <section class="stage">
    <p class="ask" id="ask" aria-live="polite"></p>
    <div class="map-wrap">
      <svg id="map" role="img" aria-label="Karta"></svg>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zooma in">+</button>
        <button type="button" id="zout" aria-label="Zooma ut">−</button>
        <button type="button" id="zreset" class="txt" aria-label="Visa hela kartan">Hela</button>
      </div>
    </div>
    <p class="credit">Karta: Natural Earth. Flaggor: flag-icons.</p>
  </section>

  <section class="panel">
    <div class="score" id="score"></div>
    <div id="body"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <button class="next" id="next" type="button" hidden>Nästa</button>
  </section>
</div>

<div class="win" id="win" hidden>
  <div class="win-card" role="dialog" aria-labelledby="wt">
    <h2 id="wt">Bra jobbat!</h2>
    <div class="stars" id="wstars"></div>
    <p id="wtext"></p>
    <div class="win-btns">
      <button class="small-btn go" id="wagain" type="button">Spela igen</button>
      <button class="small-btn" id="wmiss" type="button">Öva på missade</button>
      <button class="small-btn" id="wclose" type="button">Stäng</button>
    </div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const KEY='varldsresan-v1', ROUND=10;
const CONTS=[
  {id:'europa',namn:'Europa',ikon:'🏰'},
  {id:'afrika',namn:'Afrika',ikon:'🦁'},
  {id:'asien',namn:'Asien',ikon:'🐼'},
  {id:'nordamerika',namn:'Nordamerika',ikon:'🦅'},
  {id:'sydamerika',namn:'Sydamerika',ikon:'🦜'},
  {id:'oceanien',namn:'Oceanien',ikon:'🦘'},
  {id:'varlden',namn:'Hela världen',ikon:'🌍'}
];
const MODES=[
  {id:'utforska',namn:'Utforska',ikon:'🔍'},
  {id:'hitta',namn:'Hitta landet',ikon:'👆'},
  {id:'vilket',namn:'Vilket land?',ikon:'🗺️'},
  {id:'stad',namn:'Huvudstäder',ikon:'🏛️'},
  {id:'flagga',namn:'Flaggor',ikon:'🚩'}
];
const BY={};DATA.countries.forEach((c,i)=>{c.i=i;BY[c.c]=c;});
const flag=c=>'flaggor/'+c.toLowerCase()+'.svg';

let cont='europa', mode='utforska', sound=true;
let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){saved={};}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}}
try{if(saved.last){if(CONTS.some(c=>c.id===saved.last.cont))cont=saved.last.cont;if(MODES.some(m=>m.id===saved.last.mode))mode=saved.last.mode;}}catch(e){}

let ac=null;
function tone(f,d,type,v){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=v||.07;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));o.stop(ac.currentTime+(d||.12));
  }catch(e){}
}
const happy=()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.07),i*90));
const sad=()=>tone(180,.3,'square',.04);
function say(t,kind){const m=$('msg');m.textContent=t;m.className='msg'+(kind?' '+kind:'');}
function speak(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sv-SE';u.rate=.9;speechSynthesis.speak(u);}catch(e){}
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const pool=()=>DATA.countries.filter(c=>cont==='varlden'||c.r===cont);
function stars(right,total){const p=right/total;return p>=1?3:p>=.7?2:p>=.4?1:0;}
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};

/* ---------- Kartan ---------- */
const svg=$('map');
let V=null, vb=null, nodes={};
function drawMap(){
  V=DATA.views[cont];nodes={};
  svg.innerHTML='';
  svg.setAttribute('viewBox','0 0 '+V.w+' '+V.h);
  svg.style.aspectRatio=V.w+'/'+V.h;
  const g=document.createElementNS(NS,'g');g.id='mapg';svg.appendChild(g);
  if(V.sphere){const s=document.createElementNS(NS,'path');s.setAttribute('d',V.sphere);s.setAttribute('fill','#bfe3f8');g.appendChild(s);}
  const ctx=document.createElementNS(NS,'path');ctx.setAttribute('d',V.ctx);ctx.setAttribute('class','ctx');g.appendChild(ctx);
  for(const code in V.paths){
    const p=document.createElementNS(NS,'path');p.setAttribute('d',V.paths[code]);
    p.setAttribute('class','land c'+BY[code].f);p.dataset.c=code;g.appendChild(p);
    (nodes[code]=nodes[code]||[]).push(p);
  }
  for(const code in V.dots){
    const [x,y]=V.dots[code];
    const h=document.createElementNS(NS,'circle');h.setAttribute('cx',x);h.setAttribute('cy',y);
    h.setAttribute('class','hit');h.dataset.c=code;g.appendChild(h);
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);
    c.setAttribute('class','land dot c'+BY[code].f);c.dataset.c=code;g.appendChild(c);
    (nodes[code]=nodes[code]||[]).push(c);
  }
  const rg=document.createElementNS(NS,'g');rg.id='rings';g.appendChild(rg);
  vb={x:0,y:0,w:V.w,h:V.h};applyVB();
}
function applyVB(){
  svg.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  svg.classList.toggle('zoomed',vb.w<V.w-1);
  sizeDots();
}
/* Prickarna för små länder ska vara lika stora på skärmen oavsett zoom. */
function px(n){const r=svg.getBoundingClientRect();const s=r.width?Math.min(r.width/vb.w,r.height/vb.h):1;return n/s;}
function sizeDots(){
  const dot=px(cont==='varlden'?5:7),hit=px(cont==='varlden'?11:16);
  svg.querySelectorAll('circle.dot').forEach(c=>c.setAttribute('r',dot));
  svg.querySelectorAll('circle.hit').forEach(c=>c.setAttribute('r',hit));
  svg.querySelectorAll('circle.ring').forEach(c=>c.setAttribute('r',Math.max(+c.dataset.r,px(16))));
}
window.addEventListener('resize',()=>{if(V)sizeDots();});
function zoomAt(f,cx,cy){
  const nw=Math.min(V.w,Math.max(V.w/8,vb.w/f));const k=nw/vb.w;
  if(cx==null){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}
  vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:nw,h:vb.h*k};clampVB();applyVB();
}
function clampVB(){
  vb.x=Math.max(0,Math.min(V.w-vb.w,vb.x));vb.y=Math.max(0,Math.min(V.h-vb.h,vb.y));
}
function toMap(cx,cy){const r=svg.getBoundingClientRect();
  /* viewBox skalas likformigt och centreras i rutan */
  const s=Math.min(r.width/vb.w,r.height/vb.h);const ox=(r.width-vb.w*s)/2,oy=(r.height-vb.h*s)/2;
  return [vb.x+(cx-r.left-ox)/s, vb.y+(cy-r.top-oy)/s, s];
}
function mark(code,cls){(nodes[code]||[]).forEach(n=>n.classList.add(cls));}
function clearMarks(){
  svg.querySelectorAll('.land').forEach(n=>n.classList.remove('sel','target','ok','no'));
  $('rings').innerHTML='';
}
/* Små länder får en blinkande ring så att de syns. */
function ring(code,cls){
  const ns=nodes[code];if(!ns)return;
  let b=null;for(const n of ns){const bb=n.getBBox();if(!b||bb.width*bb.height>b.width*b.height)b=bb;}
  const size=Math.max(b.width,b.height);
  if(size>px(40))return;
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',b.x+b.width/2);c.setAttribute('cy',b.y+b.height/2);c.dataset.r=size/2+4;c.setAttribute('r',Math.max(size/2+4,px(16)));
  c.setAttribute('class','ring'+(cls?' '+cls:''));$('rings').appendChild(c);
}
/* Om landet syns dåligt när kartan är inzoomad: visa hela kartan igen. */
function ensureVisible(code){
  if(vb.w>=V.w-1)return;
  const b=nodes[code][0].getBBox();
  if(b.x<vb.x||b.y<vb.y||b.x+b.width>vb.x+vb.w||b.y+b.height>vb.y+vb.h){vb={x:0,y:0,w:V.w,h:V.h};applyVB();}
}

/* Dra, nyp och scrolla för att zooma. Ett tryck utan att dra räknas som ett klick. */
const ptrs=new Map();let dragged=false,start=null;
svg.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){dragged=false;start={x:e.clientX,y:e.clientY,vb:{...vb}};}
  else start=null;
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];const d0=Math.hypot(a.x-b.x,a.y-b.y);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const [c,d]=[...ptrs.values()];const d1=Math.hypot(c.x-d.x,c.y-d.y);
    if(d0>0){const m=toMap((c.x+d.x)/2,(c.y+d.y)/2);zoomAt(d1/d0,m[0],m[1]);}
    dragged=true;e.preventDefault();return;
  }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!start)return;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(Math.hypot(dx,dy)>8)dragged=true;
  if(dragged&&vb.w<V.w-1){
    const s=toMap(0,0)[2];
    vb.x=start.vb.x-dx/s;vb.y=start.vb.y-dy/s;clampVB();applyVB();
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
  }
});
function up(e){ptrs.delete(e.pointerId);if(!ptrs.size)start=null;}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{
  e.preventDefault();const m=toMap(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.25:1/1.25,m[0],m[1]);
},{passive:false});
svg.addEventListener('click',e=>{
  if(dragged){dragged=false;return;}
  const t=e.target.closest('[data-c]');
  if(t)tapCountry(t.dataset.c);
});
$('zin').onclick=()=>zoomAt(1.6);
$('zout').onclick=()=>zoomAt(1/1.6);
$('zreset').onclick=()=>{vb={x:0,y:0,w:V.w,h:V.h};applyVB();};

/* ---------- Val av världsdel och spel ---------- */
function bestFor(c,m){return saved[c+'-'+m]||0;}
function buildPickers(){
  const cb=$('conts');cb.innerHTML='';
  for(const c of CONTS){
    const b=el('button','chip');b.type='button';
    b.append(el('span','em',c.ikon),el('span','',c.namn));
    b.setAttribute('aria-pressed',String(c.id===cont));
    b.onclick=()=>{cont=c.id;start_();};
    cb.appendChild(b);
  }
  const mb=$('modes');mb.innerHTML='';
  for(const m of MODES){
    const b=el('button','chip');b.type='button';
    const t=el('span','');t.append(el('span','',m.namn));
    if(m.id!=='utforska'){const s=bestFor(cont,m.id);const st=el('span','st','★'.repeat(s)+'☆'.repeat(3-s));st.style.display='block';t.appendChild(st);
      b.setAttribute('aria-label',m.namn+', '+s+' av 3 stjärnor');}
    b.append(el('span','em',m.ikon),t);
    b.setAttribute('aria-pressed',String(m.id===mode));
    b.onclick=()=>{mode=m.id;start_();};
    mb.appendChild(b);
  }
  /* På telefon går raderna att scrolla i sidled: visa det valda. */
  document.querySelectorAll('.chip[aria-pressed="true"]').forEach(b=>{
    const r=b.parentNode;if(r.scrollWidth>r.clientWidth)r.scrollLeft=b.offsetLeft-r.offsetLeft-12;
  });
}

/* ---------- Spelet ---------- */
let Q=[], qi=0, right=0, results=[], missed=[], cur=null, tries=0, answered=false;

function start_(list){
  saved.last={cont,mode};persist();
  $('win').hidden=true;
  drawMap();buildPickers();clearMarks();say('');
  $('next').hidden=true;
  svg.classList.toggle('can-tap',mode==='utforska'||mode==='hitta');
  document.querySelector('.wrap').classList.toggle('flagmode',mode==='flagga');
  if(mode==='utforska'){explore();return;}
  let p=pool();
  if(mode==='stad')p=p.filter(c=>c.k);
  Q=list||shuffle(p).slice(0,ROUND);
  qi=0;right=0;results=[];missed=[];
  ask();
}
function scoreBar(){
  const s=$('score');s.innerHTML='';
  if(mode==='utforska')return;
  s.append(el('span','','Fråga '+(qi+1)+' av '+Q.length));
  const d=el('div','dots');
  Q.forEach((_,i)=>{const x=el('i',results[i]===true?'ok':results[i]===false?'no':i===qi?'now':'');d.appendChild(x);});
  s.appendChild(d);
}
function setAsk(text,code){
  const a=$('ask');a.innerHTML='';
  if(code){const im=el('img');im.src=flag(code);im.alt='';a.appendChild(im);}
  a.append(el('span','',text));
}
function infoCard(c){
  const box=el('div','info');
  const im=el('img');im.src=flag(c.c);im.alt='Flagga för '+c.n;box.appendChild(im);
  const t=el('div');t.append(el('b','',c.n));
  if(c.k)t.append(el('p','','Huvudstad: '+c.k));
  if(c.note)t.append(el('p','note',c.note));
  box.appendChild(t);return box;
}
function questionText(){
  if(!cur)return '';
  if(mode==='hitta')return 'Var ligger '+cur.n+'?';
  if(mode==='vilket')return 'Vilket land är markerat på kartan?';
  if(mode==='stad')return 'Vad heter huvudstaden i '+cur.n+'?';
  if(mode==='flagga')return 'Vilket land har den här flaggan?';
  return '';
}
function ask(){
  cur=Q[qi];tries=0;answered=false;
  clearMarks();scoreBar();say('');$('next').hidden=true;
  const body=$('body');body.innerHTML='';
  if(mode==='hitta'){
    setAsk(questionText(),cur.c);
    body.append(el('p','msg','Tryck på landet på kartan. Du kan zooma med + och −.'));
  }else{
    setAsk(questionText());
    if(mode==='flagga'){body.appendChild(el('p','ask-flag',questionText()));const im=el('img','bigflag');im.src=flag(cur.c);im.alt='Flagga';body.appendChild(im);}
    else{mark(cur.c,'target');ring(cur.c);ensureVisible(cur.c);}
    const field=mode==='stad'?'k':'n';
    let others=pool().filter(c=>c.c!==cur.c&&c[field]&&c[field]!==cur[field]);
    if(others.length<3)others=DATA.countries.filter(c=>c.c!==cur.c&&c[field]&&c[field]!==cur[field]);
    const opts=shuffle([cur,...shuffle(others).slice(0,3)]);
    const g=el('div','opts');
    opts.forEach((o,i)=>{
      const b=el('button','opt',o[field]);b.type='button';b.dataset.c=o.c;
      b.onclick=()=>choose(o,b);g.appendChild(b);
    });
    body.appendChild(g);
  }
}
function finishQ(ok){
  answered=true;results[qi]=ok;if(ok)right++;else missed.push(cur);
  scoreBar();
  const body=$('body');
  body.appendChild(infoCard(cur));
  const n=$('next');n.hidden=false;n.textContent=qi===Q.length-1?'Se resultat':'Nästa';n.focus({preventScroll:true});
}
function choose(o,btn){
  if(answered)return;
  const ok=o.c===cur.c;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.c===cur.c)b.classList.add('ok');});
  if(!ok)btn.classList.add('no');
  clearMarks();mark(cur.c,'ok');ring(cur.c,'ok');ensureVisible(cur.c);
  if(ok){happy();say('Rätt!','good');}
  else{sad();say(mode==='stad'?'Inte riktigt. Huvudstaden i '+cur.n+' är '+cur.k+'.':'Inte riktigt. Det är '+cur.n+'.','bad');}
  finishQ(ok);
}
let flashT=0;
function tapCountry(code){
  const c=BY[code];
  if(mode==='utforska'){
    clearMarks();mark(code,'sel');ring(code);
    const body=$('body');body.innerHTML='';body.appendChild(infoCard(c));
    setAsk(c.n,code);say('');
    return;
  }
  if(mode!=='hitta'||answered)return;
  if(code===cur.c){
    clearMarks();mark(code,'ok');ring(code,'ok');happy();
    say(tries===0?'Rätt! Där ligger '+cur.n+'.':'Rätt till slut! Där ligger '+cur.n+'.','good');
    finishQ(tries===0);return;
  }
  tries++;sad();
  clearTimeout(flashT);
  svg.querySelectorAll('.land.no').forEach(n=>n.classList.remove('no'));
  mark(code,'no');
  if(tries>=3){
    mark(cur.c,'target');ring(cur.c);ensureVisible(cur.c);
    say('Det där är '+c.n+'. '+cur.n+' ligger här, där det blinkar.','bad');
    finishQ(false);return;
  }
  say('Det där är '+c.n+'. Försök igen!','bad');
  flashT=setTimeout(()=>svg.querySelectorAll('.land.no').forEach(n=>n.classList.remove('no')),1200);
}
function next(){
  if(!answered)return;
  if(qi<Q.length-1){qi++;ask();}else roundOver();
}
function roundOver(){
  const s=stars(right,Q.length);
  const k=cont+'-'+mode;
  if(s>(saved[k]||0)){saved[k]=s;persist();}
  if(window.Spelhornan){const C=CONTS.find(c=>c.id===cont),M=MODES.find(m=>m.id===mode);Spelhornan.rapportera('varldsresan',k,{poang:right,max:Q.length,namn:C.namn+' · '+M.namn});}
  buildPickers();
  if(s>0)[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.08),i*130));
  $('wt').textContent=s===3?'Fantastiskt!':s>0?'Bra jobbat!':'Bra kämpat!';
  $('wstars').innerHTML=[0,1,2].map(i=>'<i class="'+(i<s?'':'off')+'">★</i>').join('');
  let t='Du fick '+right+' av '+Q.length+' rätt.';
  if(missed.length)t+=' Öva på dem du missade, så går det bättre nästa gång!';
  else t+=' Inga fel alls!';
  $('wtext').textContent=t;
  $('wmiss').hidden=!missed.length;
  $('win').hidden=false;
  $('wagain').focus();
}
function explore(){
  $('score').innerHTML='';
  setAsk('Tryck på ett land för att se vad det heter.');
  const body=$('body');body.innerHTML='';
  const n=pool().length;
  body.append(el('p','msg','Här finns '+n+' länder. Zooma in för att se de små länderna, de syns som prickar.'));
}

$('next').onclick=next;
$('wagain').onclick=()=>start_();
$('wmiss').onclick=()=>start_(shuffle(missed));
$('wclose').onclick=()=>{$('win').hidden=true;};
$('snd').onclick=function(){sound=!sound;this.setAttribute('aria-pressed',String(sound));this.textContent=sound?'Ljud på':'Ljud av';};
const sp=$('speak');
if(!('speechSynthesis' in window))sp.hidden=true;
sp.onclick=()=>{
  let t=$('ask').textContent;
  if(mode!=='utforska'&&mode!=='hitta'&&!answered){
    const o=[...document.querySelectorAll('.opt')].map(b=>b.textContent);
    if(o.length)t+=' Är det '+o.slice(0,-1).join(', ')+' eller '+o[o.length-1]+'?';
  }
  if(answered||mode==='utforska'){const i=document.querySelector('.info');if(i)t=[...i.querySelectorAll('b,p')].map(x=>x.textContent).join('. ');}
  speak(t);
};
document.addEventListener('keydown',e=>{
  if(!$('win').hidden){if(e.key==='Escape')$('win').hidden=true;return;}
  if(e.target.tagName==='INPUT')return;
  if(/^[1-4]$/.test(e.key)&&!answered){const b=document.querySelectorAll('.opt')[+e.key-1];if(b){b.click();e.preventDefault();}}
  else if(e.key==='Enter'&&answered&&e.target.tagName!=='BUTTON'){next();e.preventDefault();}
});
start_();
})();
</script>

<script src="spelhornan.js"></script>
