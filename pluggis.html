<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pluggis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one narrow column on graph paper. Home, user form, quiz and results swap in place; the big problem and the answer buttons are the focus. */
:root {
  --bg: #eef4fb;
  --grid: #d5e2f2;
  --paper: #ffffff;
  --ink: #1b2a4a;
  --muted: #5a6b8c;
  --accent: #2f6df6;
  --on-accent: #ffffff;
  --hi: #ffd84d;
  --on-hi: #1b2a4a;
  --good: #14884f;
  --bad: #cf3b57;
  --shadow: #1b2a4a;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101c30;
    --grid: #1a2c47;
    --paper: #182742;
    --ink: #e8f0fc;
    --muted: #9db0cf;
    --accent: #6b9bff;
    --on-accent: #0c1830;
    --hi: #ffd84d;
    --on-hi: #1b2a4a;
    --good: #4fd18b;
    --bad: #ff7b93;
    --shadow: #060d19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101c30;
  --grid: #1a2c47;
  --paper: #182742;
  --ink: #e8f0fc;
  --muted: #9db0cf;
  --accent: #6b9bff;
  --on-accent: #0c1830;
  --hi: #ffd84d;
  --on-hi: #1b2a4a;
  --good: #4fd18b;
  --bad: #ff7b93;
  --shadow: #060d19;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: auto; }
body {
  margin: 0;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font: 500 17px/1.45 var(--font-body);
  min-height: 100vh;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; outline: none; }
.col { display: flex; flex-direction: column; gap: 16px; }
h1, h2, .display { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 2rem; letter-spacing: .01em; }
.who { font: 600 1.05rem var(--font-display); color: var(--muted); }

.sheet {
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 16px;
  box-shadow: 5px 5px 0 var(--shadow);
  padding: 20px;
  display: flex; flex-direction: column; gap: 18px;
  min-width: 0;
}
.lead { margin: 0; color: var(--muted); }
.label { font: 600 .8rem var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: block; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  border: 2px solid var(--ink); background: var(--paper); border-radius: 12px;
  padding: .5rem .95rem; font: 600 1.05rem var(--font-display);
  min-height: 44px;
}
.chip[aria-pressed="true"] { background: var(--hi); color: var(--on-hi); box-shadow: 3px 3px 0 var(--shadow); }
.chip .sym { display: inline-block; min-width: 1.1em; margin-right: .35em; font-weight: 700; }
.linkbtn { border: 0; background: none; padding: .5rem 0; color: var(--muted); text-decoration: underline; font-weight: 700; min-height: 44px; text-align: left; }

.primary {
  border: 2px solid var(--ink); background: var(--accent); color: var(--on-accent);
  border-radius: 14px; padding: .8rem 1.2rem; font: 600 1.3rem var(--font-display);
  box-shadow: 4px 4px 0 var(--shadow); min-height: 54px;
}
.primary:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
.secondary {
  border: 2px solid var(--ink); background: var(--paper); border-radius: 14px;
  padding: .7rem 1.1rem; font: 600 1.1rem var(--font-display); min-height: 48px;
}
.secondary.danger { border-color: var(--bad); color: var(--bad); }
.best { margin: 0; font-size: .95rem; color: var(--muted); min-height: 1.4em; }
.notice { margin: 0; padding: .5rem .8rem; border: 2px dashed var(--bad); border-radius: 10px; color: var(--bad); font-weight: 700; font-size: .95rem; }

/* user form */
.field {
  width: 100%; box-sizing: border-box; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
  border-radius: 12px; padding: .7rem .9rem; font: 600 1.4rem var(--font-display);
}
.symgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; }
.symbtn { border: 2px solid var(--ink); background: var(--paper); border-radius: 12px; min-height: 56px; font-size: 1.9rem; line-height: 1; }
.symbtn[aria-pressed="true"] { background: var(--hi); box-shadow: 3px 3px 0 var(--shadow); }
.formerr { color: var(--bad); font-weight: 700; min-height: 1.4em; margin: 0; }

/* quiz */
.quizbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.quit { border: 0; background: none; padding: .4rem .2rem; color: var(--muted); text-decoration: underline; font-weight: 700; min-height: 44px; }
.meta { text-align: center; font: 600 1rem var(--font-display); }
.side { text-align: right; min-width: 4.5rem; font: 600 1rem var(--font-display); font-variant-numeric: tabular-nums; }
.side .streak { color: var(--muted); font-size: .9rem; min-height: 1.2em; }
.progress { height: 12px; border: 2px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.problem { text-align: center; font-family: var(--font-display); font-weight: 600; font-size: clamp(2rem, 10vw, 3.4rem); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); background: var(--accent); }
.dot.b { background: var(--hi); }
.dot.off { background: transparent; border-style: dashed; opacity: .55; }
.dots .gap { width: 16px; }
.answer {
  align-self: center; min-width: 6ch; text-align: center;
  font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 11vw, 3.4rem);
  border-bottom: 5px solid var(--ink); padding: 0 .4em; min-height: 1.3em; font-variant-numeric: tabular-nums;
}
.answer.empty { color: var(--muted); }
.answer.good { color: var(--good); border-color: var(--good); }
.answer.bad { color: var(--bad); border-color: var(--bad); }
.answer.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 80% { transform: translateX(-4px); } }
.feedback { text-align: center; min-height: 3.1em; font: 600 1.15rem/1.35 var(--font-display); margin: 0; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key {
  border: 2px solid var(--ink); background: var(--paper); border-radius: 12px;
  min-height: 58px; font: 600 1.7rem var(--font-display);
}
.key:active { background: var(--hi); color: var(--on-hi); }
.key.go { background: var(--accent); color: var(--on-accent); }
.key.go.next { font-size: 1.15rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.choice {
  position: relative; border: 2px solid var(--ink); background: var(--paper); border-radius: 14px; min-height: 92px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: .5rem;
}
.choice .cs { font: 700 2.6rem/1 var(--font-display); }
.choice .cs.word { font-size: 1.8rem; }
.choice .cap { font-size: .85rem; color: var(--muted); font-weight: 700; }
.choice .kh { display: none; position: absolute; top: 6px; left: 10px; font: 600 .8rem var(--font-display); color: var(--muted); }
@media (hover: hover) and (pointer: fine) { .choice .kh { display: block; } }
.choice:active { background: var(--hi); color: var(--on-hi); }
.choice:active .cap, .choice:active .kh { color: var(--on-hi); }
.choice.good { outline: 4px solid var(--good); outline-offset: -4px; }
.choice.bad { outline: 4px solid var(--bad); outline-offset: -4px; }

/* tabs and reading */
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; }
.tab { border: 0; background: var(--paper); padding: .6rem .5rem; font: 600 1.25rem var(--font-display); min-height: 52px; }
.tab + .tab { border-left: 2px solid var(--ink); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.ask { margin: 0; text-align: center; font: 600 1rem var(--font-display); color: var(--muted); }
.passage { border: 2px solid var(--ink); border-radius: 12px; padding: .9rem 1rem; background: var(--bg); font-size: 1.15rem; line-height: 1.6; overflow-wrap: anywhere; }
.problem.text { font-size: clamp(1.35rem, 6vw, 1.8rem); line-height: 1.35; }
.problem.emoji { font-size: clamp(4rem, 22vw, 6rem); line-height: 1.1; }
.problem.word { font-size: clamp(2.2rem, 11vw, 3.2rem); }
.choices.words { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.choices.words .choice { min-height: 64px; }
.choices.words .cs { font-size: 1.35rem; line-height: 1.2; overflow-wrap: anywhere; text-align: center; }
.choices.list { grid-template-columns: 1fr; }
.choices.list .choice { min-height: 58px; align-items: flex-start; padding: .6rem .9rem; text-align: left; }
.choices.list .cs { font: 600 1.15rem/1.3 var(--font-display); overflow-wrap: anywhere; text-align: left; }
.choices.list .kh { top: 50%; transform: translateY(-50%); left: auto; right: 10px; }

/* results */
.stars { text-align: center; font-size: 3rem; letter-spacing: .15em; color: var(--hi); -webkit-text-stroke: 2px var(--ink); }
.stars .off { color: transparent; }
.scoreline { text-align: center; font: 600 1.5rem var(--font-display); margin: 0; }
.timeline { text-align: center; font: 600 1.1rem var(--font-display); margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.missed { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.missed li { border: 2px solid var(--ink); border-radius: 10px; padding: .3rem .7rem; font: 600 1.05rem var(--font-display); font-variant-numeric: tabular-nums; background: var(--paper); }
.missed s { color: var(--bad); margin-left: .4em; font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions > * { flex: 1 1 auto; }

@media (prefers-reduced-motion: reduce) {
  .answer.shake { animation: none; }
  .progress > div { transition: none; }
}
</style>

<main class="app" id="app" tabindex="-1">
  <div class="topline">
    <h1 class="brand">Pluggis</h1>
    <div class="who" id="who"></div>
  </div>

  <!-- Hem -->
  <section class="sheet" id="home" hidden>
    <div class="tabs" role="tablist" aria-label="Ämne">
      <button class="tab" id="tab-math" type="button" role="tab" aria-selected="true">Matte</button>
      <button class="tab" id="tab-read" type="button" role="tab" aria-selected="false">Läsning</button>
    </div>
    <div>
      <p class="label" id="t-who">Vem tränar?</p>
      <div class="chips" id="players" role="group" aria-labelledby="t-who"></div>
      <button class="linkbtn" id="editPlayer" type="button">Ändra användare</button>
    </div>
    <div>
      <p class="label" id="t-topics">Träna på</p>
      <div class="chips" id="topics" role="group" aria-labelledby="t-topics"></div>
    </div>
    <div>
      <p class="label" id="t-level">Nivå</p>
      <div class="chips" id="lvls" role="group" aria-labelledby="t-level"></div>
      <p class="lead" id="lvlHint" style="font-size:.95rem;margin-top:10px"></p>
    </div>
    <div class="chips"><button class="chip" id="timedBtn" type="button" aria-pressed="false"></button></div>
    <p class="best" id="best"></p>
    <p class="notice" id="notice" hidden>Den här webbläsaren kan inte spara resultat. Du kan räkna ändå, men resultaten försvinner när sidan stängs.</p>
    <button class="primary" id="start" type="button">Starta</button>
  </section>

  <!-- Användare -->
  <section class="sheet" id="form" hidden>
    <h2 class="display" id="formTitle" style="font-size:1.6rem"></h2>
    <div>
      <label class="label" for="pname">Vad heter du?</label>
      <input class="field" id="pname" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false">
    </div>
    <div>
      <p class="label" id="t-sym">Välj en symbol</p>
      <div class="symgrid" id="symgrid" role="group" aria-labelledby="t-sym"></div>
    </div>
    <p class="formerr" id="formerr" role="alert"></p>
    <div class="actions">
      <button class="primary" id="saveP" type="button">Spara</button>
      <button class="secondary" id="cancelP" type="button">Avbryt</button>
      <button class="secondary danger" id="delP" type="button" hidden>Ta bort</button>
    </div>
  </section>

  <!-- Quiz -->
  <section class="col" id="game" hidden>
    <div class="quizbar">
      <button class="quit" id="quit" type="button">Avsluta</button>
      <div class="meta" id="meta"></div>
      <div class="side"><div id="clock"></div><div class="streak" id="streak"></div></div>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="bar"><div id="barfill"></div></div>
    <div class="sheet">
      <p class="ask" id="ask" hidden></p>
      <div class="passage" id="passage" hidden></div>
      <div class="problem" id="problem"></div>
      <div class="dots" id="dots" aria-hidden="true" hidden></div>
      <div class="answer empty" id="answer" aria-live="polite">?</div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="keypad" id="keypad"></div>
      <div class="choices" id="choices" hidden></div>
      <button class="primary" id="nextBtn" type="button" hidden>Nästa</button>
    </div>
  </section>

  <!-- Resultat -->
  <section class="sheet" id="results" hidden>
    <h2 class="display" id="r-title" style="text-align:center;font-size:1.8rem"></h2>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <p class="scoreline" id="scoreline"></p>
    <p class="timeline" id="r-time"></p>
    <p class="best" id="r-best" style="text-align:center"></p>
    <div id="missedWrap">
      <p class="label" id="t-missed">Träna på dessa</p>
      <ul class="missed" id="missed"></ul>
    </div>
    <div class="actions">
      <button class="primary" id="again" type="button">Spela igen</button>
      <button class="secondary" id="practiceMissed" type="button">Träna på de missade</button>
      <button class="secondary" id="toHome" type="button">Hem</button>
    </div>
  </section>
</main>

<script>
(function () {
  var TOTAL = 10, MAXP = 8;

  /* GEN-START */
  var SYM = { add: "+", sub: "−", mul: "×", div: "÷" };
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[rnd(0, a.length - 1)]; }

  function genArith(op, l) {
    var a, b, ans, r;
    if (op === "add") {
      r = { easy: [1, 5], medium: [1, 10], hard: [10, 60] }[l];
      a = rnd(r[0], r[1]); b = rnd(r[0], r[1]); ans = a + b;
    } else if (op === "sub") {
      r = { easy: [1, 10], medium: [5, 20], hard: [10, 100] }[l];
      a = rnd(r[0], r[1]); b = rnd(Math.min(r[0], a), a); ans = a - b;
    } else if (op === "mul") {
      r = { easy: [[1, 5], [1, 10]], medium: [[2, 9], [2, 9]], hard: [[6, 12], [6, 15]] }[l];
      a = rnd(r[0][0], r[0][1]); b = rnd(r[1][0], r[1][1]);
      if (l === "easy") a = pick([2, 5, 10]);
      if (Math.random() < 0.5) { var tmp = a; a = b; b = tmp; }
      ans = a * b;
    } else {
      r = { easy: [[2, 5], [2, 10]], medium: [[2, 9], [2, 9]], hard: [[6, 12], [6, 15]] }[l];
      var x = rnd(r[0][0], r[0][1]), y = rnd(r[1][0], r[1][1]);
      if (l === "easy") x = pick([2, 5, 10]);
      a = x * y; b = Math.random() < 0.5 ? x : y; ans = a / b;
    }
    var txt = a + " " + SYM[op] + " " + b;
    return {
      type: "num", topic: op, prompt: txt + " =", ans: ans, ansText: String(ans),
      review: txt + " = " + ans, key: op + a + "_" + b,
      dots: (l === "easy" && (op === "add" || op === "sub")) ? { op: op, a: a, b: b } : null
    };
  }

  function cmpSide(l) {
    var a, b, v, k;
    if (l === "easy") { v = rnd(0, 10); return { t: String(v), v: v }; }
    if (l === "medium") {
      k = rnd(0, 2);
      if (k === 0) { v = rnd(5, 30); return { t: String(v), v: v }; }
      if (k === 1) { a = rnd(1, 15); b = rnd(1, 15); return { t: a + " + " + b, v: a + b }; }
      a = rnd(10, 30); b = rnd(1, 9); return { t: a + " − " + b, v: a - b };
    }
    k = rnd(0, 3);
    if (k === 0) { v = rnd(50, 300); return { t: String(v), v: v }; }
    if (k === 1) { a = rnd(10, 150); b = rnd(10, 150); return { t: a + " + " + b, v: a + b }; }
    if (k === 2) { a = rnd(60, 200); b = rnd(10, 59); return { t: a + " − " + b, v: a - b }; }
    a = rnd(2, 12); b = rnd(2, 12); return { t: a + " × " + b, v: a * b };
  }
  function cmpEqual(v, l) {
    if (l === "easy" || v < 2) return { t: String(v), v: v };
    var x = rnd(1, v - 1);
    return { t: x + " + " + (v - x), v: v };
  }
  function genCmp(l) {
    var L = cmpSide(l), R;
    if (Math.random() < 0.15) R = cmpEqual(L.v, l); else R = cmpSide(l);
    if (l !== "easy" && R.t === L.t) R = cmpSide(l);
    var s = L.v < R.v ? "<" : (L.v > R.v ? ">" : "=");
    var full = L.t + " " + s + " " + R.t;
    return {
      type: "choice", layout: "sym", topic: "cmp", prompt: L.t + " ? " + R.t, ans: s, ansText: full, review: full,
      key: "cmp" + L.t + "_" + R.t,
      choices: [
        { v: "<", label: "<", cap: "mindre än" },
        { v: ">", label: ">", cap: "större än" },
        { v: "=", label: "=", cap: "lika med" }
      ]
    };
  }

  function genMiss(l) {
    var forms = l === "easy" ? ["a+", "+b"] : (l === "medium" ? ["a+", "+b", "a-", "-b"] : ["a+", "+b", "a-", "-b", "a*", "*b"]);
    var f = pick(forms), a, x, c, prompt, rev, ans;
    if (f === "a+" || f === "+b") {
      if (l === "easy") {
        if (Math.random() < 0.5) { x = rnd(1, 9); a = 10 - x; c = 10; }
        else { c = rnd(3, 10); x = rnd(1, c - 1); a = c - x; }
      } else if (l === "medium") { x = rnd(1, 19); a = rnd(1, 20 - x); c = a + x; }
      else { x = rnd(10, 80); a = rnd(10, 100 - x); c = a + x; }
      ans = x;
      if (f === "a+") { prompt = a + " + ? = " + c; rev = a + " + " + x + " = " + c; }
      else { prompt = "? + " + a + " = " + c; rev = x + " + " + a + " = " + c; }
    } else if (f === "a-" || f === "-b") {
      if (l === "medium") { a = rnd(5, 20); x = rnd(1, a - 1); }
      else { a = rnd(20, 100); x = rnd(10, a - 1); }
      c = a - x;
      rev = a + " − " + x + " = " + c;
      if (f === "a-") { prompt = a + " − ? = " + c; ans = x; }
      else { prompt = "? − " + x + " = " + c; ans = a; }
    } else {
      a = rnd(2, 12); x = rnd(2, 12); c = a * x; ans = x;
      if (f === "a*") { prompt = a + " × ? = " + c; rev = a + " × " + x + " = " + c; }

  function advance() {
    clearTimeout(S.timer);
    if (S.phase !== "feedback") return;
    S.i++;
    if (S.i >= S.qs.length) finish(); else renderQuestion();
  }

  /* ---------- resultat ---------- */
  function updateBest(p, c, ms) {
    var k = bestKey(), old = p.best[k];
    var rec = { c: c, ms: p.timed ? Math.round(ms) : null };
    var better = false;
    if (!old) better = c > 0;
    else if (c > old.c) better = true;
    else if (c === old.c && rec.ms != null && (old.ms == null || rec.ms < old.ms)) better = true;
    if (better) { p.best[k] = rec; saveDB(); }
    return better;
  }

  function finish() {
    clearInterval(S.tick);
    var p = player(), n = S.correct, total = S.qs.length, pct = n / total;
    var stars = pct >= 0.9 ? 3 : (pct >= 0.7 ? 2 : (pct >= 0.4 ? 1 : 0));
    $("r-title").textContent = "Rundan klar, " + p.name + "! " + p.sym;
    var st = "";
    for (var i = 0; i < 3; i++) st += i < stars ? "★" : '<span class="off">★</span>';
    $("stars").innerHTML = st;
    $("scoreline").textContent = "Du fick " + n + " av " + total + " rätt";
    $("r-time").textContent = p.timed ? "Tid: " + fmtClock(S.ms) + " · snitt " + fmtAvg(S.ms / total) + " s per fråga" : "";
    var bestLine = "";
    if (S.full) {
      var isBest = updateBest(p, n, S.ms);
      var b = p.best[bestKey()];
      if (isBest) bestLine = "Nytt rekord!";
      if (SH && n > 0) {
        var namn = sel().map(function (id) { for (var j = 0; j < TOPICS.length; j++) if (TOPICS[j].id === id) return TOPICS[j].name; return id; }).join(" + ");
        var lv = LEVELS.filter(function (l) { return l.id === S.lvl; })[0];
        SH.rapportera("pluggis", bestKey(), { poang: n, max: total, tid: p.timed ? S.ms : null, namn: namn + " · " + (lv ? lv.name : S.lvl) });
      }
      else if (b) bestLine = "Bästa: " + b.c + " av " + TOTAL + (b.ms != null ? " på " + fmtClock(b.ms) : "");
    }
    $("r-best").textContent = bestLine;
    var ul = $("missed"); ul.innerHTML = "";
    S.missed.forEach(function (m) {
      var li = document.createElement("li");
      li.textContent = m.q.review;
      var s = document.createElement("s"); s.textContent = m.given; li.appendChild(s);
      ul.appendChild(li);
    });
    $("missedWrap").hidden = S.missed.length === 0;
    $("practiceMissed").hidden = S.missed.length === 0;
    $("barfill").style.width = "100%";
    show("results");
  }

  /* ---------- koppling ---------- */
  function begin() {
    var p = player(); if (!p) return;
    p.last = { mode: S.mode, sel: { math: S.sel.math.slice(), read: S.sel.read.slice() }, lvl: S.lvl }; saveDB();
    startRound(buildRound(sel(), S.lvl), true);
  }
  ["math", "read"].forEach(function (m) {
    $("tab-" + m).addEventListener("click", function () { S.mode = m; renderHome(); });
  });
  $("start").addEventListener("click", begin);
  $("again").addEventListener("click", begin);
  $("practiceMissed").addEventListener("click", function () {
    startRound(S.missed.map(function (m) { return m.q; }), false);
  });
  $("toHome").addEventListener("click", goHome);
  $("quit").addEventListener("click", function () { clearTimeout(S.timer); clearInterval(S.tick); goHome(); });
  $("nextBtn").addEventListener("click", advance);

  function keyChoice(q, k) {
    var kk = k.length === 1 ? k.toLowerCase() : k;
    if (kk >= "1" && kk <= "9" && kk.length === 1) { var c = q.choices[Number(kk) - 1]; return c ? c.v : null; }
    if (q.topic === "cmp") { if (kk === "<" || kk === ",") return "<"; if (kk === ">" || kk === ".") return ">"; if (kk === "=") return "="; }
    if (q.topic === "eo") { if (kk === "j") return "even"; if (kk === "u") return "odd"; }
    return null;
  }

  document.addEventListener("keydown", function (e) {
    if ($("game").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var q = S.qs[S.i]; if (!q) return;
    if (e.target && e.target.id === "quit") return;
    var k = e.key, handled = true;
    if (k === "Enter") {
      if (S.phase === "feedback") advance();
      else if (q.type === "num") check();
      else handled = false;
    } else if (S.phase === "answering" && q.type === "num") {
      if (k.length === 1 && k >= "0" && k <= "9") press(k);
      else if (k === "Backspace" || k === "Delete") press("back");
      else handled = false;
    } else if (S.phase === "answering" && q.type === "choice") {
      var v = keyChoice(q, k);
      if (v) pickChoice(v); else handled = false;
    } else handled = false;
    if (handled) e.preventDefault();
  });

  buildKeypad();
  if (DB.players.length) {
    if (!player()) DB.active = DB.players[0].id;
    applyLast(player());
  }
  goHome();
})();
</script>

</body></html>
