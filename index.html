<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff1ff">
<title>Spelhörnan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#dff1ff; --ink:#12324a; --muted:#46647c; --card:#ffffff; --edge:#2b5d82;
  --accent:#ff7a3d; --shadow:rgba(18,50,74,.22);
  --font:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.35;
  padding-block:24px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:980px; margin:0 auto}
h1{font-size:2.4rem; margin:0; font-weight:700}
.sub{margin:4px 0 24px; color:var(--muted); font-size:1.1rem}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px}
.game{
  display:flex; flex-direction:column; gap:6px; padding:18px; text-decoration:none; color:inherit;
  background:var(--card); border:4px solid var(--edge); border-radius:22px; box-shadow:0 6px 0 var(--shadow);
  min-height:190px;
}
.game:hover{transform:translateY(-2px)}
.game:active{transform:translateY(3px); box-shadow:0 2px 0 var(--shadow)}
.game:focus-visible{outline:4px solid var(--accent); outline-offset:3px}
.icon{font-size:3.4rem; line-height:1}
.name{font-size:1.5rem; font-weight:700}
.desc{color:var(--muted); font-size:1rem; flex:1}
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px}
.hs{display:flex; align-items:center; gap:14px; margin:0 0 20px; padding:14px 18px; text-decoration:none; color:inherit;
  background:#fff6e0; border:4px solid var(--edge); border-radius:22px; box-shadow:0 6px 0 var(--shadow)}
.hs:hover{transform:translateY(-2px)}
.hs:active{transform:translateY(3px); box-shadow:0 2px 0 var(--shadow)}
.hs:focus-visible{outline:4px solid var(--accent); outline-offset:3px}
.hs .icon{font-size:2.6rem}
.hs .name{font-size:1.4rem}
.hs .desc{flex:1}
.age{align-self:flex-start; font-size:.9rem; font-weight:600; padding:2px 10px; border-radius:999px; background:#ffe3d3; border:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){.game:hover,.hs:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Spelhörnan</h1>
    <div id="spelarplats"></div>
  </div>
  <p class="sub">Välj ett spel och tryck för att börja.</p>
  <a class="hs" href="topplista.html">
    <span class="icon">🏆</span>
    <span><span class="name">Topplista och spelare</span><br><span class="desc">Se allas rekord i varje spel.</span></span>
  </a>
  <div class="grid" id="grid"></div>
</div>
<script>
/* Lägg till ett nytt spel genom att kopiera en rad här och byta ut texten.
   "fil" är filnamnet i samma mapp som den här sidan. */
const SPEL=[
  {namn:"Pluggis", ikon:"✏️", fil:"pluggis.html", ålder:"Matte och läsning", text:"Träna plus, minus, gånger, rim, stavning och läsförståelse. Varje barn får en egen användare."},
  {namn:"Robotresan", ikon:"🤖", fil:"robotresan.html", ålder:"6–10 år", text:"Programmera roboten att gå, hoppa och skjuta laser. Hitta kortaste vägen till flaggan och håll koll på batteriet."},
  {namn:"Världsresan", ikon:"🌍", fil:"varldsresan.html", ålder:"Geografi", text:"Hitta länder på kartan och lär dig huvudstäder och flaggor i alla världsdelar."},
  {namn:"Ordmemory", ikon:"🍕", fil:"ordmemory.html", ålder:"Läsning", text:"Memory där ordet och bilden hör ihop. Hitta \"pizza\" och pizzan! 14 teman: mat, djur, flaggor, klockan, engelska, bokstäver och mer."},
  {namn:"Krypkampen", ikon:"🐌", fil:"krypkampen.html", ålder:"7 år och uppåt", text:"Strategispel för två eller mot datorn. Lägg ut och flytta kryp och var först med att ta platserna runt blomman."},
  {namn:"Klossregn", ikon:"🧱", fil:"klossregn.html", ålder:"Alla åldrar", text:"Vrid och flytta de fallande klossarna så att de fyller hela rader. Tre svårighetsgrader."},
  {namn:"Masken", ikon:"🐍", fil:"masken.html", ålder:"Alla åldrar", text:"Ät äpplena och väx utan att krocka. Tre svårighetsgrader och en topplista."},
  {namn:"Kalaha", ikon:"🫘", fil:"kalaha.html", ålder:"Strategi, 6 år och uppåt", text:"Det klassiska brädspelet med gropar och stenar. Spela mot datorn eller mot en kompis."},
  {namn:"Banbygget", ikon:"🎢", fil:"banbygget.html", ålder:"Fysik och klurighet", text:"Bygg en bana med backar, plankor och studsmattor så att bollen, klossen eller bilen tar sig i mål."},
  {namn:"Bilbanan", ikon:"🏎️", fil:"bilbanan.html", ålder:"Alla åldrar", text:"Kör bilen runt banan med piltangenterna. Fem banor, varvtider och stjärnor."},
  {namn:"Turborallyt", ikon:"🏁", fil:"turborallyt.html", ålder:"Alla åldrar", text:"Kör 3D-racing mot fem datorbilar. Plocka presenter med raketer, såpa och snöbollar."}
];
const grid=document.getElementById('grid');
for(const s of SPEL){
  const a=document.createElement('a');
  a.className='game'; a.href=s.fil;
  const parts=[['icon',s.ikon],['name',s.namn],['desc',s.text],['age',s.ålder]];
  for(const [cls,txt] of parts){
    const d=document.createElement('div'); d.className=cls; d.textContent=txt; a.appendChild(d);
  }
  grid.appendChild(a);
}
</script>
<script src="spelhornan.js"></script>
<script>if(window.Spelhornan)Spelhornan.knapp(document.getElementById('spelarplats'));</script>
</body>
</html>
