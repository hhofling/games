<style>
/* Layout: banväljare överst, spelytan i mitten och stora styrknappar under. */
:root{
  --bg:#dff1ff; --ink:#12324a; --muted:#46647c; --card:#ffffff; --edge:#2b5d82;
  --go:#22a152; --accent:#ff7a3d; --gold:#ffc21a; --stop:#d9442b; --shadow:rgba(18,50,74,.22);
  --font:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.35;
  padding-block:12px 24px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--accent); outline-offset:2px}
.wrap{max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px}
h1{font-size:2rem; font-weight:700; margin:0}
h1 small{display:block; font-size:1rem; font-weight:500; color:var(--muted)}
.back{font-size:.95rem; color:var(--muted); font-weight:600; text-decoration:none}
.tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.small-btn{min-height:44px; padding:6px 14px; border-radius:12px; border:3px solid var(--edge); background:var(--card); font-size:1rem; font-weight:600; box-shadow:0 3px 0 var(--shadow)}
.small-btn[aria-pressed="false"]{opacity:.6}
.small-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--shadow)}
.levels{display:flex; flex-wrap:wrap; gap:8px}
.lvl{min-width:56px; min-height:56px; padding:4px 8px; border-radius:14px; border:3px solid var(--edge); background:var(--card); font-weight:700; font-size:1.15rem; line-height:1.1; box-shadow:0 3px 0 var(--shadow)}
.lvl span{display:block; font-size:.78rem; color:var(--gold); letter-spacing:.08em; min-height:1em; -webkit-text-stroke:.5px var(--edge)}
.lvl[aria-current="true"]{background:var(--accent); color:#2a1200}
.lvl[aria-current="true"] span{color:#fff}

.stage{position:relative; border:5px solid var(--edge); border-radius:20px; overflow:hidden; box-shadow:0 5px 0 var(--shadow); background:#bfe6ff;
  height:clamp(220px, min(56vw, calc(100svh - 290px)), 580px)}
canvas{display:block; width:100%; height:100%; touch-action:none}
.over{position:absolute; inset:0; display:grid; place-items:center; padding:12px; background:rgba(18,50,74,.55)}
.over[hidden]{display:none}
.card{background:var(--card); border:4px solid var(--edge); border-radius:22px; padding:16px 20px; text-align:center; max-width:400px; width:100%}
.card h2{margin:0; font-size:1.7rem}
.card p{margin:6px 0 12px; font-size:1.05rem}
.stars{font-size:2.6rem; letter-spacing:.1em; color:var(--gold); -webkit-text-stroke:1.5px var(--edge); margin:2px 0}
.stars i{font-style:normal; display:inline-block; animation:pop .5s both}
.stars i:nth-child(2){animation-delay:.15s} .stars i:nth-child(3){animation-delay:.3s}
.stars i.off{color:#e3edf5; animation:none}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)} 70%{transform:scale(1.3) rotate(8deg)} 100%{transform:scale(1)}}
.btns{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.btns .go{background:var(--go); color:#fff; border-color:#0d5a2e}

.pad{display:grid; grid-template-columns:1fr 1fr 1fr 1.5fr; gap:10px; user-select:none; -webkit-user-select:none}
.ctl{min-height:78px; border-radius:18px; border:3px solid var(--edge); background:var(--card); font-size:1.05rem; font-weight:600;
  box-shadow:0 5px 0 var(--shadow); touch-action:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; line-height:1.1;
  -webkit-touch-callout:none}

.keys{margin:0; color:var(--muted); font-size:.95rem}
kbd{font-family:inherit; font-weight:600; background:var(--card); border:2px solid var(--edge); border-radius:6px; padding:0 6px}
@media (max-width:640px){
  h1{font-size:1.6rem}

@media (prefers-reduced-motion:reduce){.stars i{animation:none}}

<script>
/*PURE-START*/
/* ---------- Banor ----------
   Varje bana byggs av en lista med bitar som läggs efter varandra från vänster till höger.
   flat(längd)  slope(längd, dy)  hill(längd, höjd)  waves(antal, längd, höjd)
   ramp(längd, höjd) = hoppramp uppåt   gap(bredd, dy) = grop med vatten, dy = landningens höjdskillnad
   log(bredd, höjd) = stock   box(bredd, höjd) = trälåda   stairs(antal, bredd, höjd) (negativ höjd = nedför)
   cp = kontrollflagga   sign(text) = skylt   goal = målet
   Mått: hjulen har radien 15 och hojen är 56 lång. Uppåt är negativt y. */
const LEVELS=[
 {id:'forsta',name:'Första turen',hint:'Håll in Gasa för att köra. Kör över backarna till målflaggan!',par:13,ops:[
  ['flat',350],['hill',320,30],['flat',150],['hill',420,55],['flat',120],['cp'],['hill',260,25],['hill',300,45],['flat',200],
  ['waves',2,300,35],['flat',150],['cp'],['hill',500,80],['flat',200],['slope',300,-40],['flat',100],['slope',300,40],['flat',200],['goal']]},
 {id:'gungor',name:'Gungbacken',hint:'Många backar i rad. Luta framåt eller bakåt så att hojen landar på hjulen.',par:19,ops:[
  ['flat',300],['waves',4,200,28],['flat',120],['cp'],['waves',4,240,48],['flat',100],['hill',380,90],['flat',150],['cp'],
  ['waves',3,160,30],['flat',100],['waves',3,260,60],['flat',200],['goal']]},
 {id:'hopp',name:'Första hoppet',hint:'Kör upp på rampen med fart och hoppa över vattnet!',par:11,ops:[
  ['flat',350],['sign','Hoppa!'],['flat',150],['ramp',160,38],['gap',90,6],['slope',200,32],['flat',200],['cp'],
  ['hill',300,40],['flat',250],['ramp',160,42],['gap',120,8],['slope',220,34],['flat',200],['cp'],
  ['sign','Hoppa!'],['flat',150],['ramp',170,45],['gap',140,10],['slope',240,35],['flat',200],['hill',300,40],['flat',150],['goal']]},
 {id:'stockar',name:'Stockar och lådor',hint:'Kör över stockarna och lådorna. Släpp gasen lite om hojen studsar.',par:18,ops:[
  ['flat',350],['log',36,12],['flat',160],['log',40,14],['flat',120],['log',36,12],['flat',180],['cp'],
  ['box',70,18],['flat',140],['box',90,24],['flat',180],['stairs',4,60,10],['flat',80],['stairs',4,60,-10],['flat',150],['cp'],
  ['log',40,14],['flat',70],['log',40,14],['flat',160],['box',80,22],['flat',160],['waves',2,200,30],['log',40,14],['flat',100],['box',100,26],['flat',200],['goal']]},
 {id:'branta',name:'Branta backen',hint:'Luta framåt när det går brant uppför, annars tippar hojen bakåt.',par:12,ops:[
  ['flat',300],['hill',360,90],['flat',100],['slope',260,-110],['flat',80],['slope',220,110],['flat',150],['cp'],
  ['hill',300,120],['flat',80],['slope',300,-150],['flat',60],['slope',160,70],['slope',160,80],['flat',160],['cp'],
  ['hill',420,170],['flat',200],['goal']]},
 {id:'storahopp',name:'Stora hoppet',hint:'Ta mycket fart innan rampen. Luta så att båda hjulen landar samtidigt.',par:13,ops:[
  ['flat',450],['sign','Fart!'],['flat',200],['ramp',200,60],['gap',170,10],['slope',260,50],['flat',250],['cp'],
  ['slope',220,-40],['flat',200],['ramp',180,55],['gap',170,15],['slope',280,30],['flat',250],['cp'],
  ['waves',2,200,40],['flat',250],['ramp',220,70],['gap',200,25],['slope',300,45],['flat',150],['goal']]},
 {id:'trappan',name:'Trappan',hint:'Kör lugnt uppför trappan. Ta sedan fart och hoppa över groparna.',par:15,ops:[
  ['flat',300],['stairs',6,55,12],['flat',250],['ramp',140,28],['gap',110,0],['flat',100],['cp'],
  ['stairs',6,55,-12],['flat',150],['box',70,22],['flat',100],['box',70,22],['flat',180],['cp'],
  ['stairs',5,50,14],['flat',280],['ramp',160,35],['gap',130,-5],['slope',200,40],['stairs',4,60,-10],['flat',150],['goal']]},
 {id:'mastar',name:'Mästarbanan',hint:'Allt på en gång! Backar, stockar, trappor och stora hopp.',par:26,ops:[
  ['flat',350],['waves',3,220,45],['flat',100],['log',40,14],['flat',200],['ramp',180,50],['gap',160,10],['slope',240,40],['flat',150],['cp'],
  ['hill',420,110],['flat',100],['box',80,22],['flat',120],['stairs',5,55,12],['flat',250],['ramp',150,35],['gap',150,5],['slope',260,90],['flat',150],['cp'],
  ['slope',280,-120],['flat',200],['ramp',200,50],['gap',180,30],['slope',300,40],['log',40,14],['flat',90],['log',40,14],['flat',150],['cp'],
  ['hill',380,90],['flat',300],['ramp',220,65],['gap',190,20],['slope',300,45],['flat',150],['goal']]}
];

function buildLevel(L){
  const P=[];let x=-500,y=0;
  const pits=[],cps=[],signs=[],deco=[];let goal=0;
  const pt=(px,py)=>{P.push({x:px,y:py});x=px;y=py;};
  pt(x,y);
  const curve=(len,f,step)=>{const n=Math.max(2,Math.ceil(len/(step||10)));const x0=x,y0=y;for(let i=1;i<=n;i++){const t=i/n;pt(x0+len*t,y0+f(t));}};
  const ops={
    flat:len=>pt(x+len,y),
    slope:(len,dy)=>curve(len,t=>dy*(1-Math.cos(Math.PI*t))/2,12),
    hill:(len,h)=>curve(len,t=>-h*(1-Math.cos(2*Math.PI*t))/2),
    waves:(n,len,h)=>{for(let i=0;i<n;i++)ops.hill(len,h);},
    ramp:(len,h)=>curve(len,t=>-h*t*t),
    gap:(w,dy)=>{const x0=x,y0=y,y1=y+dy,bot=Math.max(y0,y1)+260;
      pt(x0+1,bot);pt(x0+w-1,bot);pt(x0+w,y1);pits.push({x1:x0,x2:x0+w,w:Math.max(y0,y1)+55});},
    log:(w,h)=>{deco.push({t:'log',x:x,w:w,h:h,y:y});curve(w,t=>-h*Math.sin(Math.PI*t),5);},
    box:(w,h)=>{deco.push({t:'box',x:x,w:w,h:h,y:y});const b=Math.round(h*.9);pt(x+b,y-h);pt(x+w-2*b,y);pt(x+b,y+h);},
    stairs:(n,w,h)=>{const b=Math.max(10,Math.abs(h)*1.5);for(let i=0;i<n;i++){pt(x+b,y-h);pt(x+w-b,y);}},
    cp:()=>cps.push(x),
    sign:txt=>signs.push({x:x,y:y,text:txt}),
    goal:()=>{goal=x;}
  };
  ops.flat(500);
  for(const o of L.ops)ops[o[0]](...o.slice(1));
  pt(x+1400,y);
  return {P,pits,cps,signs,deco,goal,start:0};
}

/* ---------- Fysik ----------
   Hojen är tre punkter (bakhjul, framhjul, förarens huvud) som hålls ihop av stänger.
   Hjulen är cirklar som rullar mot marken. Om huvudet nuddar marken blir det vurpa. */
const PH={G:900,WR:15,HALF:28,UP:44,BACK:6,HR:11,ENGINE:1150,MAXV:560,BRAKE:.09,REV:-140,LEAN:1700,DT:1/120,IT:8};

function nearest(T,cx,cy){
  // Närmaste markpunkt: returnerar signerat avstånd s (negativt = inne i marken) och normal ut från marken.
  const P=T.P;let lo=0,hi=P.length-1;const xmin=cx-45;
  while(lo<hi){const m=(lo+hi)>>1;if(P[m+1].x<xmin)lo=m+1;else hi=m;}
  let best=null,bd=1e9,bs=0;
  for(let i=Math.max(0,lo-1);i<P.length-1&&P[i].x<=cx+45;i++){
    const a=P[i],b=P[i+1],dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;if(l2<1e-9)continue;
    let u=((cx-a.x)*dx+(cy-a.y)*dy)/l2;u=u<0?0:u>1?1:u;
    const qx=a.x+u*dx,qy=a.y+u*dy,ex=cx-qx,ey=cy-qy,d=Math.hypot(ex,ey);
    const l=Math.sqrt(l2),nx=dy/l,ny=-dx/l,side=(cx-a.x)*nx+(cy-a.y)*ny;
    const s=side>=0?d:-d;
    if(d<bd-1e-6||(Math.abs(d-bd)<=1e-6&&s>bs)){
      bd=d;bs=s;
      if(d>1e-6){const k=s>=0?1:-1;best={s,nx:k*ex/d,ny:k*ey/d};}else best={s:0,nx,ny};
    }
  }
  return best||{s:1e9,nx:0,ny:-1};
}
function groundY(T,x){
  let y=1e9;const P=T.P;
  for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];if(b.x-a.x<.5)continue;
    if(a.x<=x&&b.x>=x){const t=(x-a.x)/(b.x-a.x);y=Math.min(y,a.y+t*(b.y-a.y));}}
  return y;
}
function makeBike(T,x){
  const yr=groundY(T,x-PH.HALF)-PH.WR-1,yf=groundY(T,x+PH.HALF)-PH.WR-1;
  const dx=2*PH.HALF,dy=yf-yr,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;
  const mx=x,my=(yr+yf)/2,nx=uy,ny=-ux; // nx,ny pekar uppåt från hojen
  const pR={x:mx-ux*PH.HALF,y:my-uy*PH.HALF},pF={x:mx+ux*PH.HALF,y:my+uy*PH.HALF};
  const pH={x:mx+nx*PH.UP-ux*PH.BACK,y:my+ny*PH.UP-uy*PH.BACK};
  const pts=[pR,pF,pH].map((p,i)=>({x:p.x,y:p.y,px:p.x,py:p.y,m:i===2?1.6:1}));
  const L=[[0,1],[0,2],[1,2]].map(([a,b])=>({a,b,len:Math.hypot(pts[a].x-pts[b].x,pts[a].y-pts[b].y)}));
  return {p:pts,L,spin:[0,0],con:[null,null],air:0};
}
function stepBike(b,T,inp){
  const dt=PH.DT,dt2=dt*dt,[R,F,H]=b.p;
  for(const q of b.p){const vx=(q.x-q.px)*.9993,vy=(q.y-q.py)*.9993;q.px=q.x;q.py=q.y;q.x+=vx;q.y+=vy+PH.G*dt2;}
  let ax=F.x-R.x,ay=F.y-R.y;const al=Math.hypot(ax,ay);ax/=al;ay/=al;
  const px=-ay,py=ax; // pekar "nedåt" från hojen
  // motor och broms verkar bara när hjulet nuddar marken
  for(let w=0;w<2;w++){
    const c=b.con[w];if(!c)continue;const q=b.p[w];
    let tx=-c.ny,ty=c.nx;if(tx*ax+ty*ay<0){tx=-tx;ty=-ty;}
    const vt=((q.x-q.px)*tx+(q.y-q.py)*ty)/dt;
    let acc=0;
    if(w===0&&inp.gas&&vt<PH.MAXV)acc+=PH.ENGINE*Math.min(1,(PH.MAXV-vt)/120);
    if(inp.brake){
      if(vt>40)acc-=vt*PH.BRAKE/dt;
      else if(w===0&&!inp.gas&&vt>PH.REV)acc-=PH.ENGINE*.35;
    }
    if(!inp.gas&&!inp.brake)acc-=vt*.25; // rullmotstånd
    // en del av motorkraften skjuter hela hojen framåt, så att den inte stegrar sig för lätt
    const own=w===0&&inp.gas?.45:1;
    q.x+=tx*acc*own*dt2;q.y+=ty*acc*own*dt2;
    if(own<1)for(const o of [F,H]){o.x+=tx*acc*(1-own)*dt2;o.y+=ty*acc*(1-own)*dt2;}
  }
  if(inp.lean){
    const k=inp.lean*PH.LEAN*dt2*(b.con[0]||b.con[1]?.8:1);
    F.x+=px*k;F.y+=py*k;R.x-=px*k;R.y-=py*k;
    H.x+=ax*k*.4;H.y+=ay*k*.4;
  }
  b.con=[null,null];
  for(let it=0;it<PH.IT;it++){
    for(const c of b.L){
      const A=b.p[c.a],B=b.p[c.b],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1e-6;
      const diff=(d-c.len)/d,wa=1/A.m,wb=1/B.m,sum=wa+wb;
      A.x+=dx*diff*wa/sum;A.y+=dy*diff*wa/sum;B.x-=dx*diff*wb/sum;B.y-=dy*diff*wb/sum;
    }
    for(let w=0;w<2;w++){
      const q=b.p[w],n=nearest(T,q.x,q.y);
      if(n.s<PH.WR){
        const pen=PH.WR-n.s,vx=q.x-q.px,vy=q.y-q.py,vn=vx*n.nx+vy*n.ny;
        q.x+=n.nx*pen;q.y+=n.ny*pen;
        const tvx=vx-vn*n.nx,tvy=vy-vn*n.ny,bounce=vn<0?-vn*.12:vn;
        q.px=q.x-(tvx+bounce*n.nx);q.py=q.y-(tvy+bounce*n.ny);
        b.con[w]=n;
      }else if(n.s<PH.WR+1.5&&!b.con[w])b.con[w]=n;
    }
  }
  // hjulens snurr (bara för utseendet)
  for(let w=0;w<2;w++){const q=b.p[w];b.spin[w]+=((q.x-q.px)*ax+(q.y-q.py)*ay)/PH.WR;}
  b.air=b.con[0]||b.con[1]?0:b.air+dt;
  const h=nearest(T,H.x,H.y);
  if(h.s<PH.HR)return 'crash';

$('wagain').onclick=reset;
$('wnext').onclick=()=>loadLevel(Math.min(cur+1,LEVELS.length-1));
$('snd').onclick=function(){sound=!sound;this.setAttribute('aria-pressed',String(sound));this.textContent=sound?'Ljud på':'Ljud av';if(!sound)engine(false);this.blur();};
const sp=$('speak');
if(!('speechSynthesis' in window))sp.hidden=true;
sp.onclick=function(){
  this.blur();
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(LEVELS[cur].name+'. '+LEVELS[cur].hint);u.lang='sv-SE';u.rate=.9;speechSynthesis.speak(u);}catch(e){}
};
try{if(window.Spelhornan&&typeof Spelhornan.knapp==='function')Spelhornan.knapp($('tools'));}catch(e){}

let first=0;
for(let i=0;i<LEVELS.length;i++){first=i;if(!(saved[LEVELS[i].id]&&saved[LEVELS[i].id].s>0))break;}
resize();loadLevel(first);
requestAnimationFrame(t=>{last=t;tick(t);});
})();
</script>
</body>
</html>
